<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"广大","o":["extensive, widespread","vast, extensive","rule, regulation","law, regular pattern; regular"],"a":1,"say":"广大","sent":"这次活动吸引了广大同学参加，现场非常热闹。","sent_en":"This activity attracted a vast number of classmates, and the scene was very lively.","ex":"广大 guǎngdà — vast, extensive · 这次活动吸引了广大同学参加，现场非常热闹。 / This activity attracted a vast number of classmates, and the scene was very lively. (also in textbook Lesson 5 济南的泉水; 广大 often describes a large group of people or a vast area, as in 广大同学 / 广大地区; 广泛 describes a wide range or scope)","py":"guǎngdà"},{"t":"mc","q":"广泛","o":["vast, extensive","scale, size","extensive, widespread","National Day"],"a":2,"say":"广泛","sent":"她的兴趣很广泛，既喜欢国画，也喜欢运动。","sent_en":"Her interests are very wide-ranging; she likes both traditional Chinese painting and sports.","ex":"广泛 guǎngfàn — extensive, widespread · 她的兴趣很广泛，既喜欢国画，也喜欢运动。 / Her interests are very wide-ranging; she likes both traditional Chinese painting and sports. (广泛 describes range or scope, as in 兴趣广泛 / 广泛使用; 广大 describes a vast group or area)","py":"guǎngfàn"},{"t":"mc","q":"规律","o":["rule, regulation","scale, size","traditional Chinese painting","law, regular pattern; regular"],"a":3,"say":"规律","sent":"每天按时睡觉、按时起床，生活才会有规律。","sent_en":"Only if you go to bed and get up on time every day will your life have a regular pattern.","ex":"规律 guīlǜ — law, regular pattern; regular · 每天按时睡觉、按时起床，生活才会有规律。 / Only if you go to bed and get up on time every day will your life have a regular pattern. (规律 is a regular pattern, or regular; 规则 means a rule or regulation, as in 比赛规则; 规模 means scale or size)","py":"guīlǜ"},{"t":"mc","q":"规模","o":["regular pattern","rule, regulation","scale, size","cupboard, cabinet"],"a":2,"say":"规模","sent":"这次交流活动的规模很大，来了几百名同学。","sent_en":"The scale of this exchange activity was very large; several hundred classmates came.","ex":"规模 guīmó — scale, size · 这次交流活动的规模很大，来了几百名同学。 / The scale of this exchange activity was very large; several hundred classmates came. (规模 is how large something is; 规律 is a regular pattern; 规则 is a rule)","py":"guīmó"},{"t":"mc","q":"规则","o":["scale, size","law, regular pattern; regular","rule, regulation; regular","vast, extensive"],"a":2,"say":"规则","sent":"比赛开始以前，老师先向大家说明了几条基本规则。","sent_en":"Before the competition began, the teacher first explained a few basic rules to everyone.","ex":"规则 guīzé — rule, regulation; regular · 比赛开始以前，老师先向大家说明了几条基本规则。 / Before the competition began, the teacher first explained a few basic rules to everyone. (规则 are rules people should follow; 规律 is a regular pattern in life or nature; 规模 is scale)","py":"guīzé"},{"t":"mc","q":"贵姓","o":["your honorable surname","National Day","traditional Chinese painting","good luck"],"a":0,"say":"贵姓","sent":"老师笑着问新同学：“请问贵姓？”","sent_en":"The teacher asked the new classmate with a smile, “May I ask your surname?”","ex":"贵姓 guìxìng — your honorable surname · 老师笑着问新同学：“请问贵姓？” / The teacher asked the new classmate with a smile, “May I ask your surname?” (贵姓 is a polite way to ask someone’s surname; 贵 here means honorable / your)","py":"guìxìng"},{"t":"mc","q":"柜子","o":["pot","fruit","contract","cupboard, cabinet"],"a":3,"say":"柜子","sent":"Alexa把画纸放进柜子里，免得被风吹走。","sent_en":"Alexa put the drawing paper into the cabinet, so that the wind would not blow it away.","ex":"柜子 guìzi — cupboard, cabinet · Alexa把画纸放进柜子里，免得被风吹走。 / Alexa put the drawing paper into the cabinet, so that the wind would not blow it away. (柜子 is a cabinet or cupboard; 子 is neutral tone)","py":"guìzi"},{"t":"mc","q":"滚","o":["to close, to fit","to roll","to expire","to contain"],"a":1,"say":"滚","sent":"一阵风吹来，画纸在地上滚了几圈。","sent_en":"A gust of wind blew over, and the drawing paper rolled a few times on the ground.","ex":"滚 gǔn — to roll · 一阵风吹来，画纸在地上滚了几圈。 / A gust of wind blew over, and the drawing paper rolled a few times on the ground.","py":"gǔn"},{"t":"mc","q":"锅","o":["cabinet","boxed meal","pot","river"],"a":2,"say":"锅","sent":"妈妈在厨房里放了一口新锅，准备做晚饭。","sent_en":"Mum put a new pot in the kitchen, ready to make dinner.","ex":"锅 guō — pot · 妈妈在厨房里放了一口新锅，准备做晚饭。 / Mum put a new pot in the kitchen, ready to make dinner. (一口锅 uses the measure word 口)","py":"guō"},{"t":"mc","q":"国画","o":["traditional Chinese painting","National Day","group photo","customs"],"a":0,"say":"国画","sent":"林同学带来了自己画的一幅国画，老师看了以后连连称赞。","sent_en":"Classmate Lin brought a traditional Chinese painting that he had painted himself, and the teacher praised it again and again after looking at it.","ex":"国画 guóhuà — traditional Chinese painting · 林同学带来了自己画的一幅国画，老师看了以后连连称赞。 / Classmate Lin brought a traditional Chinese painting that he had painted himself, and the teacher praised it again and again after looking at it. (国画 is traditional Chinese painting; 国庆 is National Day)","py":"guóhuà"}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"National Day","o":["国庆","国画","规则","规模"],"a":0,"say":"国庆","sent":"再过几天就是国庆了，学校准备举办一场演出。","sent_en":"In a few more days it will be National Day, and the school is preparing to hold a performance.","ex":"国庆 guóqìng — National Day · 再过几天就是国庆了，学校准备举办一场演出。 / In a few more days it will be National Day, and the school is preparing to hold a performance. (国庆 is National Day; 国画 is traditional Chinese painting)","py":"guóqìng"},{"t":"mc","q":"indeed, as expected","o":["果实","果然","过分","过于"],"a":1,"say":"果然","sent":"她猜今天会很有意思，结果果然如此。","sent_en":"She guessed that today would be very interesting, and indeed it turned out that way.","ex":"果然 guǒrán — indeed, as expected · 她猜今天会很有意思，结果果然如此。 / She guessed that today would be very interesting, and indeed it turned out that way. (果然 means things happened just as expected; 果实 means fruit)","py":"guǒrán"},{"t":"mc","q":"fruit","o":["锅","盒饭","果实","合同"],"a":2,"say":"果实","sent":"秋天到了，树上结满了成熟的果实。","sent_en":"Autumn has come, and the trees are covered with ripe fruit.","ex":"果实 guǒshí — fruit · 秋天到了，树上结满了成熟的果实。 / Autumn has come, and the trees are covered with ripe fruit. (果实 is fruit, often fruit on a tree, or figuratively the fruits of one’s work; 果然 means indeed / as expected)","py":"guǒshí"},{"t":"mc","q":"excessive","o":["过分","过于","过期","过度"],"a":3,"say":"过度","sent":"复习很重要，但是不要过度疲劳，也要适当休息。","sent_en":"Review is very important, but do not become excessively tired; you also need to rest properly.","ex":"过度 guòdù — excessive · 复习很重要，但是不要过度疲劳，也要适当休息。 / Review is very important, but do not become excessively tired; you also need to rest properly. (过度 often comes before a verb or noun, as in 过度疲劳 / 过度使用; 过分 is over the top, often about behaviour; 过于 is an adverb before an adjective, as in 过于紧张)","py":"guòdù"},{"t":"mc","q":"excessive, over the top","o":["过分","过度","过于","过期"],"a":0,"say":"过分","sent":"对同学说话要礼貌，开过分的玩笑会让别人不高兴。","sent_en":"You should speak politely to classmates; making over-the-top jokes will make other people unhappy.","ex":"过分 guòfèn — excessive, over the top · 对同学说话要礼貌，开过分的玩笑会让别人不高兴。 / You should speak politely to classmates; making over-the-top jokes will make other people unhappy. (过分 often describes behaviour that goes too far; 过度 is excessive degree, as in 过度疲劳; 过于 is an adverb before an adjective)","py":"guòfèn"},{"t":"mc","q":"to be allergic","o":["过期","过敏","过度","过分"],"a":1,"say":"过敏","sent":"有的同学对海鲜过敏，所以中午换了别的菜。","sent_en":"Some classmates are allergic to seafood, so at noon they changed to other dishes.","ex":"过敏 guòmǐn — to be allergic · 有的同学对海鲜过敏，所以中午换了别的菜。 / Some classmates are allergic to seafood, so at noon they changed to other dishes. (对…过敏 means to be allergic to…; 过期 means to expire)","py":"guòmǐn"},{"t":"mc","q":"to expire","o":["过敏","过度","过期","过于"],"a":2,"say":"过期","sent":"老师提醒大家看看食品有没有过期，过期的东西不能吃。","sent_en":"The teacher reminded everyone to check whether the food had expired; things that have expired cannot be eaten.","ex":"过期 guòqī — to expire · 老师提醒大家看看食品有没有过期，过期的东西不能吃。 / The teacher reminded everyone to check whether the food had expired; things that have expired cannot be eaten. (过期 is to go past the time limit, as with food or a ticket; 过敏 is to be allergic)","py":"guòqī"}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"这次考试她不要____紧张，平时练习得已经很充分了。","o":["过于","过度","过分","过期"],"a":0,"say":"过于","sent":"这次考试她不要过于紧张，平时练习得已经很充分了。","sent_en":"For this exam she should not be too nervous; her usual practice has already been quite thorough.","ex":"过于 guòyú — too, excessively · 这次考试她不要过于紧张，平时练习得已经很充分了。 / For this exam she should not be too nervous; her usual practice has already been quite thorough. (过于 is an adverb used before an adjective, as in 过于紧张; 过度 often comes before a verb or noun, as in 过度疲劳; 过分 is over the top, often about behaviour)","py":"guòyú"},{"t":"mc","q":"听到这个笑话，他____地笑了一声。","o":["滚","哈","合","好"],"a":1,"say":"哈","sent":"听到这个笑话，他哈地笑了一声。","sent_en":"When he heard this joke, he gave a “ha” of laughter.","ex":"哈 hā — ha, onomatopoeia for laughter · 听到这个笑话，他哈地笑了一声。 / When he heard this joke, he gave a “ha” of laughter. (哈 is the sound of laughter, as in 哈哈; here 哈地笑了一声 means he laughed with a “ha”)","py":"hā"},{"t":"mc","q":"从国外回来时，我们要在____办理检查手续。","o":["海外","海鲜","海关","河流"],"a":2,"say":"海关","sent":"从国外回来时，我们要在海关办理检查手续。","sent_en":"When we come back from abroad, we have to go through inspection procedures at customs.","ex":"海关 hǎiguān — customs · 从国外回来时，我们要在海关办理检查手续。 / When we come back from abroad, we have to go through inspection procedures at customs. (海关 is the customs office; 海外 means overseas / abroad)","py":"hǎiguān"},{"t":"mc","q":"那位叔叔介绍了去____旅行时要注意的事情。","o":["海关","海鲜","汗水","海外"],"a":3,"say":"海外","sent":"那位叔叔介绍了去海外旅行时要注意的事情。","sent_en":"That uncle explained the things one should pay attention to when travelling overseas.","ex":"海外 hǎiwài — overseas, abroad · 那位叔叔介绍了去海外旅行时要注意的事情。 / That uncle explained the things one should pay attention to when travelling overseas. (海外 means overseas / abroad; 海关 is customs)","py":"hǎiwài"},{"t":"mc","q":"中午食堂准备了新鲜的____，但有的同学不能吃。","o":["海鲜","盒饭","果实","河流"],"a":0,"say":"海鲜","sent":"中午食堂准备了新鲜的海鲜，但有的同学不能吃。","sent_en":"At noon the canteen prepared fresh seafood, but some classmates could not eat it.","ex":"海鲜 hǎixiān — seafood · 中午食堂准备了新鲜的海鲜，但有的同学不能吃。 / At noon the canteen prepared fresh seafood, but some classmates could not eat it. (also in textbook Lesson 3 人生有选择；海鲜 is seafood; 盒饭 is a boxed meal)","py":"hǎixiān"},{"t":"mc","q":"老师说，跑步的时候不要把糖____在嘴里。","o":["含有","含量","含","合"],"a":2,"say":"含","sent":"老师说，跑步的时候不要把糖含在嘴里。","sent_en":"The teacher said not to hold sweets in your mouth while running.","ex":"含 hán — to contain; to hold in the mouth · 老师说，跑步的时候不要把糖含在嘴里。 / The teacher said not to hold sweets in your mouth while running. (here 含 means to hold in the mouth; 含有 means to contain; 含量 is the content / amount contained)","py":"hán"}]},{"title":"四、易混词 Look-alikes in sentences","hint":"choose the word that fits · 🔊","items":[{"t":"mc","q":"这种水果的维生素____很高，对身体很好。","o":["含量","含有","含","合"],"a":0,"say":"含量","sent":"这种水果的维生素含量很高，对身体很好。","sent_en":"The vitamin content of this kind of fruit is very high, which is very good for the body.","ex":"含量 hánliàng — content · 这种水果的维生素含量很高，对身体很好。 / The vitamin content of this kind of fruit is very high, which is very good for the body. (含量 is the amount contained; 含有 is the verb to contain; 含 can mean to hold in the mouth, or to contain)","py":"hánliàng"},{"t":"mc","q":"这种饮料____丰富的维生素，喝起来也清爽。","o":["含量","含有","含","合"],"a":1,"say":"含有","sent":"这种饮料含有丰富的维生素，喝起来也清爽。","sent_en":"This drink contains rich vitamins, and it also tastes refreshing.","ex":"含有 hányǒu — to contain · 这种饮料含有丰富的维生素，喝起来也清爽。 / This drink contains rich vitamins, and it also tastes refreshing. (含有 is the verb to contain; 含量 is a noun meaning the amount contained)","py":"hányǒu"},{"t":"mc","q":"走了这么远的路，大家脸上全是____。","o":["海鲜","海外","汗水","海关"],"a":2,"say":"汗水","sent":"走了这么远的路，大家脸上全是汗水。","sent_en":"After walking such a long way, everyone’s faces were covered in sweat.","ex":"汗水 hànshuǐ — sweat · 走了这么远的路，大家脸上全是汗水。 / After walking such a long way, everyone’s faces were covered in sweat. (汗水 is sweat; do not confuse it with 海鲜 seafood, 海外 overseas, or 海关 customs)","py":"hànshuǐ"},{"t":"mc","q":"会场的座位排成一____一行，看起来整整齐齐。","o":["行业","行","合同","河流"],"a":1,"say":"行","sent":"会场的座位排成一行一行，看起来整整齐齐。","sent_en":"The seats in the hall were arranged in rows, and looked very neat and tidy.","ex":"行 háng — line, row; measure word for lines · 会场的座位排成一行一行，看起来整整齐齐。 / The seats in the hall were arranged in rows, and looked very neat and tidy. (here 行 is 2nd-tone háng, a line or row, as in 一行字 / 银行; it is not xíng, which means to go or to be OK. 行业 means an industry or trade)","py":"háng"},{"t":"mc","q":"他将来想进入医学这个____，所以现在特别认真学习。","o":["行","合同","行业","海关"],"a":2,"say":"行业","sent":"他将来想进入医学这个行业，所以现在特别认真学习。","sent_en":"He wants to enter the medical profession in the future, so he is studying especially hard now.","ex":"行业 hángyè — industry, trade · 他将来想进入医学这个行业，所以现在特别认真学习。 / He wants to enter the medical profession in the future, so he is studying especially hard now. (行业 is an industry or field of work; 行 by itself can mean a line / row)","py":"hángyè"},{"t":"mc","q":"在网上买东西签____以前，一定要看清楚每一条内容。","o":["合影","合法","合理","合同"],"a":3,"say":"合同","sent":"在网上买东西签合同以前，一定要看清楚每一条内容。","sent_en":"Before you sign a contract when buying something online, you must read every item clearly.","ex":"合同 hétóng — contract · 在网上买东西签合同以前，一定要看清楚每一条内容。 / Before you sign a contract when buying something online, you must read every item clearly. (合同 is a contract; 合影 is a group photo; 合法 means legal; 合理 means reasonable)","py":"hétóng"},{"t":"mc","q":"演出结束后，全班同学一起____留念。","o":["合影","合同","合法","合理"],"a":0,"say":"合影","sent":"演出结束后，全班同学一起合影留念。","sent_en":"After the performance ended, the whole class took a group photo as a souvenir.","ex":"合影 héyǐng — to take a group photo; group phot      it.o.forEach(function(txt,j){
       var wrap=el("span","optwrap");
       var b=el("button","opt",L[j]+". "+txt);b.type="button";
       b.onclick=function(){if(done)return;rec.sel=j;[].forEach.call(o.querySelectorAll(".opt"),function(c){c.classList.remove("sel")});b.classList.add("sel");prog()};
       wrap.appendChild(b);
       if(hasHan(txt) && String(txt).length<=8) wrap.appendChild(speakBtn(txt,true));
       o.appendChild(wrap);
     });
     box.appendChild(o);
   } else {
     var row=el("div","optwrap");
     var inp=el("input","txt");inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");inp.setAttribute("spellcheck","false");inp.placeholder="写汉字…";inp.oninput=prog;rec.input=inp;
     row.appendChild(inp);
     if(it.say){var lb=speakBtn(it.say,false);lb.title="Listen (does not show the answer)";row.appendChild(lb);row.appendChild(el("span","tip","听发音"));}
     box.appendChild(row);
   }
   var fb=el("div","fb");box.appendChild(fb);rec.fb=fb;sec.appendChild(box);ALL.push(rec);
  });
  quiz.appendChild(sec);
 });
 prog();
}
function norm(s){return String(s||"").replace(/[\s\u3000]+/g,"")}
function isCorrect(rec){var it=rec.it;if(it.t==="mc")return rec.sel===it.a;var v=norm(rec.input.value);return it.a.some(function(a){return norm(a)===v})}
function answered(rec){return rec.it.t==="mc"?rec.sel!==null:norm(rec.input.value)!==""}
function prog(){var a=ALL.filter(answered).length;document.getElementById("prog").textContent="已答 "+a+" / "+ALL.length}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function tick(){document.getElementById("clock").textContent=fmt(Date.now()-start)}
function check(){
 if(done)return;done=true;clearInterval(timerId);var score=0;
 ALL.forEach(function(rec){var ok=isCorrect(rec),it=rec.it;rec.box.classList.add(ok?"ok":"bad");
  var ans=it.t==="mc"?L[it.a]+". "+it.o[it.a]:it.a[0];
  rec.fb.textContent=ok?"✔ 对了！":"✘ Correct answer: "+ans+" — "+it.ex;if(ok)score++});
 document.getElementById("quiz").classList.add("locked");
 var t=fmt(Date.now()-start),pct=Math.round(score/ALL.length*100);
 var msg=pct===100?"太棒了！🎉":pct>=80?"很好！👍":pct>=60?"不错，继续加油！💪":"加油！Let's review the red ones. 📚";
 var r=document.getElementById("result");r.style.display="block";r.innerHTML="";
 r.appendChild(el("div",null,"得分 Score: "+score+" / "+ALL.length+" ("+pct+"%)"));
 r.appendChild(el("div",null,"用时 Time: "+t));r.appendChild(el("div",null,msg));
 try{r.scrollIntoView({behavior:"smooth"});}catch(e){}
 return {score:score,total:ALL.length,time:t};
}
function reset(){done=false;try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
 document.getElementById("quiz").classList.remove("locked");document.getElementById("result").style.display="none";start=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();build();try{window.scrollTo(0,0);}catch(e){}}
document.getElementById("check").onclick=check;
document.getElementById("reset").onclick=reset;
build();timerId=setInterval(tick,1000);tick();

</script>
<!-- PWA-SCRIPT -->
<script>
(function(){
  var KEY="alexa-chinese-scores";
  function drillId(){
    var m=(location.pathname||"").match(/([^/]+)\.html$/i);
    return m?decodeURIComponent(m[1]):null;
  }
  function save(){
    var r=document.getElementById("result");
    if(!r)return;
    var text=r.textContent||"";
    var m=text.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i)||text.match(/得分[^0-9]*(\d+)\s*\/\s*(\d+)/);
    if(!m)return;
    var id=drillId();
    if(!id)return;
    var score=+m[1], total=+m[2];
    if(!(total>0) || !(score>=0) || score>total)return;
    try{
      var all={};
      try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
      if(typeof all!=="object"||Array.isArray(all)) all={};
      all[id]={score:score,total:total,at:new Date().toISOString()};
      localStorage.setItem(KEY,JSON.stringify(all));
    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
<!-- /PWA-SCRIPT -->
