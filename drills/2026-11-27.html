<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"据说","o":["it is said, reportedly","to have, to possess","concrete, specific","to donate"],"a":0,"say":"据说","py":"jùshuō","sent":"据说，这个中心具有先进的设备，正在开发新技术，并开展关于昆虫的研究。","sent_en":"It is said that this center has advanced equipment, is developing new technology, and is carrying out research on insects.","ex":"据说 jùshuō — it is said, reportedly · 据说，这个中心具有先进的设备。 / It is said that this center has advanced equipment. (据说 introduces something you have heard or that people say. 具有 means to possess; 具体 means concrete or specific; 捐 means to donate.)"},{"t":"mc","q":"具体","o":["to open for business","absolute; absolutely","concrete, specific","to develop"],"a":2,"say":"具体","py":"jùtǐ","sent":"中心介绍了一项具体计划：请大家捐一些资料放到库里。","sent_en":"The center introduced a specific plan: please donate some materials to put in the storeroom.","ex":"具体 jùtǐ — concrete, specific · 中心介绍了一项具体计划。 / The center introduced a specific plan. (具体 means concrete or detailed, not vague. 绝对 means absolutely; 开发 means to develop; 开业 means to open for business.)"},{"t":"mc","q":"具有","o":["to donate","to have, to possess","to visit","to overcome"],"a":1,"say":"具有","py":"jùyǒu","sent":"据说，这个中心具有先进的设备，正在开发新技术，并开展关于昆虫的研究。","sent_en":"It is said that this center has advanced equipment, is developing new technology, and is carrying out research on insects.","ex":"具有 jùyǒu — to have, to possess · 这个中心具有先进的设备。 / This center has advanced equipment. (具有 is a formal way to say that something possesses a quality or resource. 据说 means it is said; 捐 means to donate; 克服 means to overcome.)"},{"t":"mc","q":"捐","o":["to donate","to control","to rely on","to open a ceremony"],"a":0,"say":"捐","py":"juān","sent":"中心介绍了一项具体计划：请大家捐一些资料放到库里。","sent_en":"The center introduced a specific plan: please donate some materials to put in the storeroom.","ex":"捐 juān — to donate · 请大家捐一些资料放到库里。 / Please donate some materials to put in the storeroom. (捐 means to give something to help, often money or goods. 控制 means to control; 靠 means to rely on; 开幕 means to open a ceremony.)"},{"t":"mc","q":"绝对","o":["reliable, dependable","terrible, frightening","objective","absolute; absolutely"],"a":3,"say":"绝对","py":"juéduì","sent":"这场决赛绝对精彩。","sent_en":"This final match was absolutely wonderful.","ex":"绝对 juéduì — absolute; absolutely · 这场决赛绝对精彩。 / This final match was absolutely wonderful. (绝对 means completely, with no exception. 可靠 means reliable; 可怕 means frightening; 客观 means objective.)"},{"t":"mc","q":"决赛","o":["opening ceremony","final match","scientific research","customer service"],"a":1,"say":"决赛","py":"juésài","sent":"下午还举行了球赛决赛。","sent_en":"In the afternoon there was also the final of a ball game.","ex":"决赛 juésài — final match · 下午还举行了球赛决赛。 / In the afternoon there was also the final of a ball game. (决赛 is the last, deciding match. 开幕式 is an opening ceremony; 科研 is scientific research; 客服 is customer service.)"},{"t":"mc","q":"角色","o":["role, character","client, customer","pocket","insect"],"a":0,"say":"角色","py":"juésè","sent":"每个角色都很重要。","sent_en":"Every role was very important.","ex":"角色 juésè — role, character · 每个角色都很重要。 / Every role was very important. (角色 is a part someone plays, in a story, a team or a situation. In this word list it is read juésè, not jiǎosè. 客户 means a client; 口袋 means a pocket; 昆虫 means an insect.)"},{"t":"mc","q":"决心","o":["to overcome","determination, resolve","boiled water","width"],"a":1,"say":"决心","py":"juéxīn","sent":"可见，他们办事很客观，也有决心克服困难。","sent_en":"It can be seen that they handle matters objectively and also have the determination to overcome difficulties.","ex":"决心 juéxīn — determination, resolve · 他们也有决心克服困难。 / They also have the determination to overcome difficulties. (决心 is a firm decision to do something. This word also appeared in Lesson 4 子路背米. 克服 is the verb 'to overcome'; 开水 is boiled water; 宽度 means width.)"},{"t":"mc","q":"开发","o":["to open; open","to carry out","to develop","to open for business"],"a":2,"say":"开发","py":"kāifā","sent":"据说，这个中心具有先进的设备，正在开发新技术，并开展关于昆虫的研究。","sent_en":"It is said that this center has advanced equipment, is developing new technology, and is carrying out research on insects.","ex":"开发 kāifā — to develop · 正在开发新技术。 / (They) are developing new technology. (开发 is to develop something new, such as technology or a resource. 开放 means to open up; 开展 means to carry out an activity or a project; 开业 means to open for business.)"},{"t":"mc","q":"开放","o":["to develop","to open a service or line","to open a ceremony","to open; open"],"a":3,"say":"开放","py":"kāifàng","sent":"开幕以后，中心开通了网上服务，还开放了部分实验室给公众参观。","sent_en":"After the opening, the center launched an online service and also opened some laboratories to the public for visits.","ex":"开放 kāifàng — to open; open · 还开放了部分实验室给公众参观。 / (They) also opened some laboratories to the public for visits. (开放 means to open something to people, or to be open-minded. 开发 means to develop; 开通 means to open a service or a line; 开幕 means to open a ceremony.)"}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"to open a ceremony or exhibition","o":["开幕","开幕式","开业","开放"],"a":0,"say":"开幕","py":"kāimù","sent":"开幕以后，中心开通了网上服务，还开放了部分实验室给公众参观。","sent_en":"After the opening, the center launched an online service and also opened some laboratories to the public for visits.","ex":"开幕 kāimù — to open a ceremony or exhibition · 开幕以后，中心开通了网上服务。 / After the opening, the center launched an online service. (开幕 is the verb 'to open' a ceremony or show. 开幕式 is the noun 'opening ceremony'; 开业 means to open for business; 开放 means to open something to the public.)"},{"t":"mc","q":"opening ceremony","o":["开幕","开幕式","开业","开通"],"a":1,"say":"开幕式","py":"kāimùshì","sent":"开幕式在一个很宽的大厅里举行，大厅的宽度超过三十米，空间很大，空中挂着许多彩灯。","sent_en":"The opening ceremony was held in a very wide hall; the hall’s width was more than thirty meters, the space was large, and many colored lights were hanging in the air.","ex":"开幕式 kāimùshì — opening ceremony · 开幕式在一个很宽的大厅里举行。 / The opening ceremony was held in a very wide hall. (开幕式 is the ceremony itself. 开幕 is the verb 'to open (a ceremony)'; 开业 means to open for business; 开通 means to open a service or a line.)"},{"t":"mc","q":"boiled water","o":["开业","开通","开水","开放"],"a":2,"say":"开水","py":"kāishuǐ","sent":"老师请她喝开水，又从口袋里拿出一颗糖。","sent_en":"The teacher offered her some boiled water, and then took a sweet out of her pocket.","ex":"开水 kāishuǐ — boiled water · 老师请她喝开水。 / The teacher offered her some boiled water. (开水 is water that has been boiled, often for drinking. Do not confuse it with 开业, 开通 or 开放, which are all 'open' words but have nothing to do with water.)"},{"t":"mc","q":"to open a service or line","o":["开放","开发","开通","开业"],"a":2,"say":"开通","py":"kāitōng","sent":"开幕以后，中心开通了网上服务，还开放了部分实验室给公众参观。","sent_en":"After the opening, the center launched an online service and also opened some laboratories to the public for visits.","ex":"开通 kāitōng — to open a service or line · 中心开通了网上服务。 / The center launched an online service. (开通 is used for opening a phone line, a route or an online service. 开放 means to open something to the public; 开发 means to develop; 开业 means to open for business.)"},{"t":"mc","q":"to open for business","o":["开幕","开放","开通","开业"],"a":3,"say":"开业","py":"kāiyè","sent":"今日，一座新的科研中心开业了。","sent_en":"Today, a new scientific-research center opened for business.","ex":"开业 kāiyè — to open for business · 一座新的科研中心开业了。 / A new scientific-research center opened for business. (开业 is when a shop, company or center starts operating. 开幕 opens a ceremony; 开放 opens something to the public; 开通 opens a service or a line.)"},{"t":"mc","q":"to carry out, to launch (an activity or project)","o":["开发","开展","开放","开通"],"a":1,"say":"开展","py":"kāizhǎn","sent":"据说，这个中心具有先进的设备，正在开发新技术，并开展关于昆虫的研究。","sent_en":"It is said that this center has advanced equipment, is developing new technology, and is carrying out research on insects.","ex":"开展 kāizhǎn — to carry out, to launch · 并开展关于昆虫的研究。 / and is carrying out research on insects. (开展 means to start and carry out a project, an activity or research. 开发 means to develop something new, such as technology; 开放 means to open up; 开通 means to open a service.)"},{"t":"mc","q":"to visit (someone)","o":["看作","看望","靠近","靠"],"a":1,"say":"看望","py":"kànwàng","sent":"Alexa前来看望一位在这里工作的老师。","sent_en":"Alexa came to visit a teacher who works here.","ex":"看望 kànwàng — to visit (someone) · Alexa前来看望一位在这里工作的老师。 / Alexa came to visit a teacher who works here. (看望 is to go and see someone, often a teacher, a relative or a person who is ill. 看作 means to regard as; 靠近 means to get close to; 靠 means to lean on or rely on.)"}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"Alexa把这里____一个友好的地方。","o":["看望","看作","看","靠近"],"a":1,"say":"看作","py":"kànzuò","sent":"Alexa把这里看作一个友好的地方。","sent_en":"Alexa regarded this place as a friendly one.","ex":"看作 kànzuò — to regard as, to consider as · Alexa把这里看作一个友好的地方。 / Alexa regarded this place as a friendly one. (看作 means to treat or consider A as B. 看望 means to visit someone; 看 here would be incomplete; 靠近 means to get close to.)"},{"t":"mc","q":"他们____认真的态度控制每一个环节，绝不让工作亏本。","o":["靠近","捐","靠","控制"],"a":2,"say":"靠","py":"kào","sent":"他们靠认真的态度控制每一个环节，绝不让工作亏本。","sent_en":"They relied on a careful attitude to control every step, and would never let the work run at a loss.","ex":"靠 kào — to lean on, to rely on · 他们靠认真的态度控制每一个环节。 / They relied on a careful attitude to control every step. (靠 can mean to depend on something, or to lean on someone. 靠近 means to get close to; 捐 means to donate; 控制 is already the later verb in this sentence, 'to control'.)"},{"t":"mc","q":"老师说可以慢慢____，不必害怕。","o":["靠","靠近","开放","看望"],"a":1,"say":"靠近","py":"kàojìn","sent":"老师说可以慢慢靠近，不必害怕。","sent_en":"The teacher said they could approach slowly and need not be afraid.","ex":"靠近 kàojìn — to approach, to get close to · 老师说可以慢慢靠近，不必害怕。 / The teacher said they could approach slowly and need not be afraid. (靠近 means to move nearer. 靠 means to lean on or rely on, but does not by itself mean 'to come close'; 开放 means to open; 看望 means to visit.)"},{"t":"mc","q":"老师请她喝开水，又从口袋里拿出一____糖。","o":["库","宽","角色","颗"],"a":3,"say":"颗","py":"kē","sent":"老师请她喝开水，又从口袋里拿出一颗糖。","sent_en":"The teacher offered her some boiled water, and then took a sweet out of her pocket.","ex":"颗 kē — measure word for small round objects · 又从口袋里拿出一颗糖。 / and then took a sweet out of her pocket. (颗 is used for small, round things such as sweets, stars or pearls. 库 means a storeroom or warehouse; 宽 means wide; 角色 means a role.)"},{"t":"mc","q":"今日，一座新的____中心开业了。","o":["客服","科研","决赛","开幕式"],"a":1,"say":"科研","py":"kēyán","sent":"今日，一座新的科研中心开业了。","sent_en":"Today, a new scientific-research center opened for business.","ex":"科研 kēyán — scientific research · 一座新的科研中心开业了。 / A new scientific-research center opened for business. (科研 is short for 科学研究, scientific research. 客服 is customer service; 决赛 is a final match; 开幕式 is an opening ceremony.)"},{"t":"mc","q":"____，他们办事很客观，也有决心克服困难。","o":["据说","绝对","可见","具体"],"a":2,"say":"可见","py":"kějiàn","sent":"可见，他们办事很客观，也有决心克服困难。","sent_en":"It can be seen that they handle matters objectively and also have the determination to overcome difficulties.","ex":"可见 kějiàn — it can be seen that, obviously · 可见，他们办事很客观。 / It can be seen that they handle matters objectively. (可见 draws a conclusion from what was just said. 据说 means 'it is said' and introduces a rumour or report, not a conclusion; 绝对 means absolutely; 具体 means specific.)"}]},{"title":"四、易混词 Look-alikes in sentences","hint":"choose the word that fits · 🔊","items":[{"t":"mc","q":"客服人员把每一位客户都看作重要的合作伙伴，服务非常____。","o":["可靠","可怕","客观","可见"],"a":0,"say":"可靠","py":"kěkào","sent":"客服人员把每一位客户都看作重要的合作伙伴，服务非常可靠。","sent_en":"The customer-service staff regarded every client as an important partner, and their service was very reliable.","ex":"可靠 kěkào — reliable, dependable · 服务非常可靠。 / Their service was very reliable. (可靠 means you can trust it or them. 可怕 means frightening; 客观 means objective, not influenced by personal feeling; 可见 means 'it can be seen that'. All four start with 可, but only 可靠 means reliable.)"},{"t":"mc","q":"有人觉得科研有点儿____，老师说可以慢慢靠近，不必害怕。","o":["可靠","客观","可怕","克服"],"a":2,"say":"可怕","py":"kěpà","sent":"有人觉得科研有点儿可怕，老师说可以慢慢靠近，不必害怕。","sent_en":"Some people found scientific research a little frightening; the teacher said they could approach slowly and need not be afraid.","ex":"可怕 kěpà — terrible, frightening · 有人觉得科研有点儿可怕。 / Some people found scientific research a little frightening. (可怕 describes something that makes you afraid. 可靠 means reliable; 客观 means objective; 克服 means to overcome. The sentence also has 不必害怕, which matches 可怕.)"},{"t":"mc","q":"可见，他们办事很客观，也有决心____困难。","o":["客服","客观","控制","克服"],"a":3,"say":"克服","py":"kèfú","sent":"可见，他们办事很客观，也有决心克服困难。","sent_en":"It can be seen that they handle matters objectively and also have the determination to overcome difficulties.","ex":"克服 kèfú — to overcome · 也有决心克服困难。 / and also have the determination to overcome difficulties. (克服 means to get over a difficulty. 客服 is customer service and is pronounced the same, kèfú, but it is a different word with different characters. 客观 means objective; 控制 means to control.)"},{"t":"mc","q":"____人员把每一位客户都看作重要的合作伙伴，服务非常可靠。","o":["客户","客服","克服","客观"],"a":1,"say":"客服","py":"kèfú","sent":"客服人员把每一位客户都看作重要的合作伙伴，服务非常可靠。","sent_en":"The customer-service staff regarded every client as an important partner, and their service was very reliable.","ex":"客服 kèfú — customer service · 客服人员把每一位客户都看作重要的合作伙伴。 / The customer-service staff regarded every client as an important partner. (客服 is short for 客户服务. It has the same pinyin as 克服, kèfú, but 克服 means to overcome. 客户 is the client; 客观 means objective.)"},{"t":"mc","q":"可见，他们办事很_    if(it.t==="mc"){
     var o=el("div","opts");
     it.o.forEach(function(txt,j){
       var wrap=el("span","optwrap");
       var b=el("button","opt",L[j]+". "+txt);b.type="button";
       b.onclick=function(){if(done)return;rec.sel=j;[].forEach.call(o.querySelectorAll(".opt"),function(c){c.classList.remove("sel")});b.classList.add("sel");prog()};
       wrap.appendChild(b);
       if(hasHan(txt) && String(txt).length<=8) wrap.appendChild(speakBtn(txt,true));
       o.appendChild(wrap);
     });
     box.appendChild(o);
   } else {
     var row=el("div","optwrap");
     var inp=el("input","txt");inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");inp.setAttribute("spellcheck","false");inp.placeholder="写汉字…";inp.oninput=prog;rec.input=inp;
     row.appendChild(inp);
     if(it.say){var lb=speakBtn(it.say,false);lb.title="Listen (does not show the answer)";row.appendChild(lb);row.appendChild(el("span","tip","听发音"));}
     box.appendChild(row);
   }
   var fb=el("div","fb");box.appendChild(fb);rec.fb=fb;sec.appendChild(box);ALL.push(rec);
  });
  quiz.appendChild(sec);
 });
 prog();
}
function norm(s){return String(s||"").replace(/[\s\u3000]+/g,"")}
function isCorrect(rec){var it=rec.it;if(it.t==="mc")return rec.sel===it.a;var v=norm(rec.input.value);return it.a.some(function(a){return norm(a)===v})}
function answered(rec){return rec.it.t==="mc"?rec.sel!==null:norm(rec.input.value)!==""}
function prog(){var a=ALL.filter(answered).length;document.getElementById("prog").textContent="已答 "+a+" / "+ALL.length}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function tick(){document.getElementById("clock").textContent=fmt(Date.now()-start)}
function check(){
 if(done)return;done=true;clearInterval(timerId);var score=0;
 ALL.forEach(function(rec){var ok=isCorrect(rec),it=rec.it;rec.box.classList.add(ok?"ok":"bad");
  var ans=it.t==="mc"?L[it.a]+". "+it.o[it.a]:it.a[0];
  rec.fb.textContent=ok?"✔ 对了！":"✘ Correct answer: "+ans+" — "+it.ex;if(ok)score++});
 document.getElementById("quiz").classList.add("locked");
 var t=fmt(Date.now()-start),pct=Math.round(score/ALL.length*100);
 var msg=pct===100?"太棒了！🎉":pct>=80?"很好！👍":pct>=60?"不错，继续加油！💪":"加油！Let's review the red ones. 📚";
 var r=document.getElementById("result");r.style.display="block";r.innerHTML="";
 r.appendChild(el("div",null,"得分 Score: "+score+" / "+ALL.length+" ("+pct+"%)"));
 r.appendChild(el("div",null,"用时 Time: "+t));r.appendChild(el("div",null,msg));
 try{r.scrollIntoView({behavior:"smooth"});}catch(e){}
 return {score:score,total:ALL.length,time:t};
}
function reset(){done=false;try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
 document.getElementById("quiz").classList.remove("locked");document.getElementById("result").style.display="none";start=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();build();try{window.scrollTo(0,0);}catch(e){}}
document.getElementById("check").onclick=check;
document.getElementById("reset").onclick=reset;
build();timerId=setInterval(tick,1000);tick();

</script>
<!-- PWA-SCRIPT -->
<script>
(function(){
  var KEY="alexa-chinese-scores";
  function drillId(){
    var m=(location.pathname||"").match(/([^/]+)\.html$/i);
    return m?decodeURIComponent(m[1]):null;
  }
  function save(){
    var r=document.getElementById("result");
    if(!r)return;
    var text=r.textContent||"";
    var m=text.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i)||text.match(/得分[^0-9]*(\d+)\s*\/\s*(\d+)/);
    if(!m)return;
    var id=drillId();
    if(!id)return;
    var score=+m[1], total=+m[2];
    if(!(total>0) || !(score>=0) || score>total)return;
    try{
      var all={};
      try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
      if(typeof all!=="object"||Array.isArray(all)) all={};
      all[id]={score:score,total:total,at:new Date().toISOString()};
      localStorage.setItem(KEY,JSON.stringify(all));
    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
<!-- /PWA-SCRIPT -->
