te"],"a":3,"sent":"欢迎大家积极参与这次讨论。","sent_en":"Everyone is welcome to take an active part in this discussion.","ex":"参与 cānyù — to participate · 欢迎大家积极参与这次讨论。 / Everyone is welcome to take an active part in this discussion."},{"t":"mc","q":"操作","py":"cāozuò","say":"操作","o":["to operate","to measure","to insert","to produce"],"a":0,"sent":"请按照说明书操作这台机器。","sent_en":"Please operate this machine according to the instruction manual.","ex":"操作 cāozuò — to operate · 请按照说明书操作这台机器。 / Please operate this machine according to the instruction manual."},{"t":"mc","q":"产品","py":"chǎnpǐn","say":"产品","o":["output, production","product","industry","length"],"a":1,"sent":"这家公司的产品质量很好，所以卖得很快。","sent_en":"This company’s products are of very good quality, so they sell quickly.","ex":"产品 chǎnpǐn — product · 这家公司的产品质量很好，所以卖得很快。 / This company’s products are of very good quality, so they sell quickly."},{"t":"mc","q":"常识","py":"chángshí","say":"常识","o":["to attempt, to try","strength, strong point","common knowledge","place, venue"],"a":2,"sent":"过马路要看红绿灯，这是基本的交通常识。","sent_en":"Looking at the traffic lights when crossing the street is basic traffic common knowledge.","ex":"常识 chángshí — common knowledge · 过马路要看红绿灯，这是基本的交通常识。 / Looking at the traffic lights when crossing the street is basic traffic common knowledge."},{"t":"mc","q":"场所","py":"chǎngsuǒ","say":"场所","o":["length","long-distance","place, venue","strength, strong point"],"a":2,"sent":"图书馆是一个安静的学习场所。","sent_en":"The library is a quiet place for studying.","ex":"场所 chǎngsuǒ — place, venue · 图书馆是一个安静的学习场所。 / The library is a quiet place for studying."}]},{"title":"二、根据意思选词 Choose the word","hint":"use the example sentence · tap Chinese · 🔊 on options","items":[{"t":"mc","q":"talent, ability","o":["才","采取","参考","测试"],"a":0,"ex":"才 cái — talent, ability · 他很有才，不仅会弹钢琴，还会写诗。 / He is very talented; he can not only play the piano but also write poetry.","sent":"他很有才，不仅会弹钢琴，还会写诗。","sent_en":"He is very talented; he can not only play the piano but also write poetry."},{"t":"mc","q":"color","o":["采取","彩色","采用","参考"],"a":1,"ex":"彩色 cǎisè — color · 小朋友喜欢用彩色笔画画。 / Children like to draw with coloured pencils.","sent":"小朋友喜欢用彩色笔画画。","sent_en":"Children like to draw with coloured pencils."},{"t":"mc","q":"to consult, to refer to","o":["参与","采访","参考","采取"],"a":2,"ex":"参考 cānkǎo — to consult, to refer to · 写文章时，你应该参考几本专业书籍。 / When writing an article, you should consult several specialized books.","sent":"写文章时，你应该参考几本专业书籍。","sent_en":"When writing an article, you should consult several specialized books."},{"t":"mc","q":"measure word for books","o":["测","册","叉","产"],"a":1,"ex":"册 cè — measure word for books · 老师发给每个学生一册新课本。 / The teacher gave each student a new textbook.","sent":"老师发给每个学生一册新课本。","sent_en":"The teacher gave each student a new textbook."},{"t":"mc","q":"fork","o":["尺子","册子","叉子","拆子"],"a":2,"ex":"叉子 chāzi — fork · 吃蛋糕的时候，请把叉子递给我。 / When we eat the cake, please pass me the fork.","sent":"吃蛋糕的时候，请把叉子递给我。","sent_en":"When we eat the cake, please pass me the fork."},{"t":"mc","q":"output, production","o":["产品","产业","产量","产生"],"a":2,"ex":"产量 chǎnliàng — output, production · 今年大米的产量比去年增加了。 / This year’s rice output has increased compared with last year.","sent":"今年大米的产量比去年增加了。","sent_en":"This year’s rice output has increased compared with last year."},{"t":"mc","q":"to arise, to produce (L5 review: 产生)","o":["产品","产量","产业","产生"],"a":3,"ex":"产生 chǎnshēng — to arise, to produce · 长期压力会产生健康问题。 / Long-term stress can give rise to health problems. (also in textbook Lesson 5)","sent":"长期压力会产生健康问题。","sent_en":"Long-term stress can give rise to health problems."}]},{"title":"三、填空 Fill the blank","hint":"read EN translation, tap the missing word · 🔊","items":[{"t":"mc","q":"为了保护环境，政府____了新的措施。","o":["采用","采取","参考","参与"],"a":1,"py_hint":"cǎiqǔ","ex":"采取 cǎiqǔ — to adopt, to use · 为了保护环境，政府采取了新的措施。 / To protect the environment, the government adopted new measures.","sent_en":"To protect the environment, the government adopted new measures."},{"t":"mc","q":"这所学校____了新的教学方法。","o":["采取","采用","参考","参与"],"a":1,"py_hint":"cǎiyòng","ex":"采用 cǎiyòng — to adopt, to use · 这所学校采用了新的教学方法。 / This school has adopted a new teaching method.","sent_en":"This school has adopted a new teaching method."},{"t":"mc","q":"工程师正在____这款新软件。","o":["测试","测","参考","操作"],"a":0,"py_hint":"cèshì","ex":"测试 cèshì — to test · 工程师正在测试这款新软件。 / The engineer is testing this new software.","sent_en":"The engineer is testing this new software."},{"t":"mc","q":"我____在北京住过三年。","o":["曾","曾经","尝试","常识"],"a":1,"py_hint":"céngjīng","ex":"曾经 céngjīng — once, ever · 我曾经在北京住过三年。 / I once lived in Beijing for three years.","sent_en":"I once lived in Beijing for three years."},{"t":"mc","q":"每个人都有自己的____和不足。","o":["长度","长久","长处","长期"],"a":2,"py_hint":"chángchù","ex":"长处 chángchù — strength, strong point · 每个人都有自己的长处和不足。 / Everyone has their own strengths and shortcomings.","sent_en":"Everyone has their own strengths and shortcomings."},{"t":"mc","q":"司机因为____被警察罚款了。","o":["超级","超出","超","超速"],"a":3,"py_hint":"chāosù","ex":"超速 chāosù — to speed, to exceed the speed limit · 司机因为超速被警察罚款了。 / The driver was fined by the police for speeding.","sent_en":"The driver was fined by the police for speeding."}]},{"title":"四、易混词 Look-alikes in sentences","hint":"tap the word that fits · 🔊","items":[{"t":"mc","q":"这两种颜色看起来差不多，____其实很小。","o":["差别","差距","常识","长处"],"a":0,"ex":"差别 chābié — difference · 这两种颜色看起来差不多，差别其实很小。 / These two colours look almost the same; the difference is actually very small.","sent_en":"These two colours look almost the same; the difference is actually very small."},{"t":"mc","q":"这两支球队的实力____正在逐渐缩小。","o":["差别","差距","长处","长度"],"a":1,"ex":"差距 chājù — gap, disparity · 这两支球队的实力差距正在逐渐缩小。 / The gap in strength between these two teams is gradually narrowing.","sent_en":"The gap in strength between these two teams is gradually narrowing."},{"t":"mc","q":"请把这支花____进花瓶里。","o":["拆","插","测","产"],"a":1,"ex":"插 chā — to insert · 请把 var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");
  b.type="button";b.setAttribute("aria-label","Pronounce");b.textContent="🔊";
  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function addExample(box, it){
  if(!it.sent && !it.sent_en) return;
  var ex=el("div","exbox");
  if(it.sent){
    var row=el("div","ex-cn");
    row.appendChild(document.createTextNode("例句："+it.sent+" "));
    if(hasHan(it.sent)) row.appendChild(speakBtn(it.sent.replace(/____/g, it.say||it.q||""), true));
    ex.appendChild(row);
  }
  if(it.sent_en) ex.appendChild(el("div","ex-en","EN: "+it.sent_en));
  box.appendChild(ex);
}
function build(){
 var quiz=document.getElementById("quiz");quiz.innerHTML="";ALL=[];
 SECTIONS.forEach(function(s){
  var sec=el("section");var h=el("h2",null,s.title+" ");h.appendChild(el("small",null,"("+s.hint+")"));sec.appendChild(h);
  if(s.passage){
    var ph=el("div","pass-head");ph.appendChild(el("strong",null,"短文"));ph.appendChild(speakBtn(s.passage,false));

  }
  s.items.forEach(function(it,i){
   var box=el("div","item");

   qrow.appendChild(el("span",null,(i+1)+". "));

   if(it.py) qrow.appendChild(el("span","py","("+it.py+")"));
   if(it.py_hint) qrow.appendChild(el("span","py","拼音提示: "+it.py_hint));
   var sayText=it.say||(hasHan(it.q)&&!/____/.test(it.q)?it.q:null);
   if(sayText && !/____/.test(String(it.q))) qrow.appendChild(speakBtn(sayText,false));
   box.appendChild(qrow);
   addExample(box, it);
   var rec={it:it,box:box,sel:null,input:null};
   if(it.t==="mc"){
     var o=el("div","opts");
     it.o.forEach(function(txt,j){
       var wrap=el("span","optwrap");
       var b=el("button","opt",L[j]+". "+txt);b.type="button";
       b.onclick=function(){if(done)return;rec.sel=j;[].forEach.call(o.querySelectorAll(".opt"),function(c){c.classList.remove("sel")});b.classList.add("sel");prog()};
       wrap.appendChild(b);
       if(hasHan(txt) && String(txt).length<=8) wrap.appendChild(speakBtn(txt,true));
       o.appendChild(wrap);

   } else {

     row.appendChild(inp);

 });

function norm(s){return String(s||"").replace(/[\s\u3000]+/g,"")}
function isCorrect(rec){var it=rec.it;if(it.t==="mc")return rec.sel===it.a;var v=norm(rec.input.value);return it.a.some(function(a){return norm(a)===v})}
function answered(rec){return rec.it.t==="mc"?rec.sel!==null:norm(rec.input.value)!==""}
function prog(){var a=ALL.filter(answered).length;document.getElementById("prog").textContent="已答 "+a+" / "+ALL.length}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function tick(){document.getElementById("clock").textContent=fmt(Date.now()-start)}
function check(){
 if(done)return;done=true;clearInterval(timerId);var score=0;
 ALL.forEach(function(rec){var ok=isCorrect(rec),it=rec.it;rec.box.classList.add(ok?"ok":"bad");
  var ans=it.t==="mc"?L[it.a]+". "+it.o[it.a]:it.a[0];
  rec.fb.textContent=ok?"✔ 对了！":"✘ Correct answer: "+ans+" — "+it.ex;if(ok)score++});
 document.getElementById("quiz").classList.add("locked");
 var t=fmt(Date.now()-start),pct=Math.round(score/ALL.length*100);
 var msg=pct===100?"太棒了！🎉":pct>=80?"很好！👍":pct>=60?"不错，继续加油！💪":"加油！Let's review the red ones. 📚";
 var r=document.getElementById("result");r.style.display="block";r.innerHTML="";
 r.appendChild(el("div",null,"得分 Score: "+score+" / "+ALL.length+" ("+pct+"%)"));
 r.appendChild(el("div",null,"用时 Time: "+t));r.appendChild(el("div",null,msg));
 try{r.scrollIntoView({behavior:"smooth"});}catch(e){}
 return {score:score,total:ALL.length,time:t};
}
function reset(){done=false;try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
 document.getElementById("quiz").classList.remove("locked");document.getElementById("result").style.display="none";start=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();build();try{window.scrollTo(0,0);}catch(e){}}
document.getElementById("check").onclick=check;
document.getElementById("reset").onclick=reset;
build();timerId=setInterval(tick,1000);tick();

</script>

<script>

    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
