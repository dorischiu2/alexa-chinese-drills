<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"从而","py":"cóng’ér","say":"从而","o":["thus, thereby","formerly, before","to engage in, to pursue","never"],"a":0,"sent":"他每天坚持练习，从而进步很快。","sent_en":"He practised every day, and thus improved quickly.","ex":"从而 cóng’ér — thus, thereby · 他每天坚持练习，从而进步很快。 / He practised every day, and thus improved quickly. (also textbook Lesson 5 grammar: cause or method → result)"},{"t":"mc","q":"从前","py":"cóngqián","say":"从前","o":["thus, thereby","to exist","formerly, before","to ask about"],"a":2,"sent":"从前，这里还是一片安静的小村子。","sent_en":"In the past, this place was still a quiet little village.","ex":"从前 cóngqián — formerly, before · 从前，这里还是一片安静的小村子。 / In the past, this place was still a quiet little village."},{"t":"mc","q":"从事","py":"cóngshì","say":"从事","o":["to promote, to advance","to engage in, to pursue","to reach, to accomplish","to hold the position of"],"a":1,"sent":"大学毕业后，她开始从事教育工作。","sent_en":"After graduating from university, she began to work in education.","ex":"从事 cóngshì — to engage in, to pursue · 大学毕业后，她开始从事教育工作。 / After graduating from university, she began to work in education."},{"t":"mc","q":"促进","py":"cùjìn","say":"促进","o":["to urge, to prompt","to promote (sales)","to urge, to hurry","to promote, to advance"],"a":3,"sent":"这次交流活动促进了两国学生的友谊。","sent_en":"This exchange activity promoted friendship between students of the two countries.","ex":"促进 cùjìn — to promote, to advance · 这次交流活动促进了两国学生的友谊。 / This exchange activity promoted friendship between students of the two countries. (促进 a development or relationship; 促使 means to prompt somebody to do something)"},{"t":"mc","q":"促使","py":"cùshǐ","say":"促使","o":["to promote, to advance","to urge, to prompt","to promote (sales)","measure, step"],"a":1,"sent":"老师的鼓励促使他更加努力地学习。","sent_en":"The teacher's encouragement prompted him to study even harder.","ex":"促使 cùshǐ — to urge, to prompt · 老师的鼓励促使他更加努力地学习。 / The teacher's encouragement prompted him to study even harder."},{"t":"mc","q":"措施","py":"cuòshī","say":"措施","o":["to reach, to accomplish","treatment, salary","measure, step","to deposit, to store"],"a":2,"sent":"学校采取了新的安全措施，保护学生的健康。","sent_en":"The school adopted new safety measures to protect students' health.","ex":"措施 cuòshī — measure, step · 学校采取了新的安全措施，保护学生的健康。 / The school adopted new safety measures to protect students' health."},{"t":"mc","q":"达成","py":"dáchéng","say":"达成","o":["to reach, to accomplish","to replace","to drive, to bring about","to interrupt"],"a":0,"sent":"经过长时间讨论，双方终于达成了协议。","sent_en":"After a long discussion, the two sides finally reached an agreement.","ex":"达成 dáchéng — to reach, to accomplish · 经过长时间讨论，双方终于达成了协议。 / After a long discussion, the two sides finally reached an agreement."},{"t":"mc","q":"打听","py":"dǎting","say":"打听","o":["to dress up, to disguise","to pack, to take out","to interrupt","to ask about"],"a":3,"sent":"她向邻居打听去火车站怎么走。","sent_en":"She asked a neighbour how to get to the railway station.","ex":"打听 dǎting — to ask about · 她向邻居打听去火车站怎么走。 / She asked a neighbour how to get to the railway station. (also in textbook Lesson 4; 听 is a neutral tone here)"},{"t":"mc","q":"代表","py":"dàibiǎo","say":"代表","o":["to replace","to drive, to bring about","representative; to represent","to hold the position of"],"a":2,"sent":"他代表全班向老师表达了感谢。","sent_en":"He represented the whole class in expressing thanks to the teacher.","ex":"代表 dàibiǎo — representative; to represent · 他代表全班向老师表达了感谢。 / He represented the whole class in expressing thanks to the teacher."},{"t":"mc","q":"担任","py":"dānrèn","say":"担任","o":["alone, separately","to hold the position of","single; alone; bill, list","to represent; generation"],"a":1,"sent":"明年她将担任学生会主席。","sent_en":"Next year she will hold the position of student-union president.","ex":"担任 dānrèn — to hold the position of · 明年她将担任学生会主席。 / Next year she will hold the position of student-union president."}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"to promote (sales)","py":"cùxiāo","say":"促销","o":["促进","促使","促销","催"],"a":2,"ex":"促销 cùxiāo — to promote (sales) · 这家商店正在促销，很多衣服都很便宜。 / This shop is running a sales promotion, and many clothes are very cheap.","sent":"这家商店正在促销，很多衣服都很便宜。","sent_en":"This shop is running a sales promotion, and many clothes are very cheap."},{"t":"mc","q":"to deposit, to store","py":"cúnfàng","say":"存放","o":["存放","存款","存在","措施"],"a":0,"ex":"存放 cúnfàng — to deposit, to store · 请把行李存放在服务台旁边。 / Please store your luggage beside the service desk.","sent":"请把行李存放在服务台旁边。","sent_en":"Please store your luggage beside the service desk."},{"t":"mc","q":"to deposit money; deposit","py":"cúnkuǎn","say":"存款","o":["存放","存在","达成","存款"],"a":3,"ex":"存款 cúnkuǎn — to deposit money; deposit · 他把多余的钱放到银行作为存款。 / He put the extra money in the bank as a deposit.","sent":"他把多余的钱放到银行作为存款。","sent_en":"He put the extra money in the bank as a deposit."},{"t":"mc","q":"to exist","py":"cúnzài","say":"存在","o":["从前","存放","存在","存款"],"a":2,"ex":"存在 cúnzài — to exist · 这个问题已经存在很久了，必须尽快解决。 / This problem has already existed for a long time and must be solved as soon as possible.","sent":"这个问题已经存在很久了，必须尽快解决。","sent_en":"This problem has already existed for a long time and must be solved as soon as possible."},{"t":"mc","q":"to dress up, to disguise","py":"dǎban","say":"打扮","o":["打包","打扮","打断","打破"],"a":1,"ex":"打扮 dǎban — to dress up, to disguise · 过年的时候，孩子们都打扮得很漂亮。 / At New Year, the children all dress up very beautifully. (扮 is a neutral tone here)","sent":"过年的时候，孩子们都打扮得很漂亮。","sent_en":"At New Year, the children all dress up very beautifully."},{"t":"mc","q":"elephant","py":"dàxiàng","say":"大象","o":["大厦","大事","大象","大型"],"a":2,"ex":"大象 dàxiàng — elephant · 动物园里的大象正在慢慢走路。 / The elephant in the zoo was walking slowly.","sent":"动物园里的大象正在慢慢走路。","sent_en":"The elephant in the zoo was walking slowly."},{"t":"mc","q":"mansion, building","py":"dàshà","say":"大厦","o":["大厦","大会","大众","大脑"],"a":0,"ex":"大厦 dàshà — mansion, building · 市中心新盖了一座很高的大厦。 / A very tall building has newly been built in the city centre.","sent":"市中心新盖了一座很高的大厦。","sent_en":"A very tall building has newly been built in the city centre."}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"妈妈____他快点出门，不然就要迟到了。","o":["促使","促销","催","促进"],"a":2,"say":"催","sent":"妈妈催他快点出门，不然就要迟到了。","ex":"催 cuī — to urge, to hurry · 妈妈催他快点出门，不然就要迟到了。 / Mum urged him to go out quickly, otherwise he would be late.","sent_en":"Mum urged him to go out quickly, otherwise he would be late."},{"t":"mc","q":"吃不完的菜，我们可以____带回家。","o":["打扮","打包","打断","打破"],"a":1,"say":"打包","sent":"吃不完的菜，我们可以打包带回家。","ex":"打包 dǎbāo — to pack, to take out · 吃不完的菜，我们可以打包带回家。 / We can pack up the dishes we cannot finish and take them home.","sent_en":"We can pack up the dishes we cannot finish and take them home."},{"t":"mc","q":"请不要____别人的发言，等他说完再提问。","o":["打破","打听","打断","打扮"],"a":2,"say":"打断","sent":"请不要打断别人的发言，等他说完再提问。","ex":"打断 dǎduàn — to interrupt · 请不要打断别人的发言，等他说完再提问。 / Please do not interrupt other people's remarks; wait until they have finished before asking questions.","sent_en":"Please do not interrupt other people's remarks; wait until they have finished before asking questions."},{"t":"mc","q":"不小心____了杯子，她连忙道了歉。","o":["打断","打破","打包","打听"],"a":1,"say":"打破","sent":"不小心打破了杯子，她连忙道了歉。","ex":"打破 dǎpò — to break · 不小心打破了杯子，她连忙道了歉。 / She accidentally broke a cup and quickly apologised.","sent_en":"She accidentally broke a cup and quickly apologised."},{"t":"mc","q":"她很____，第一次上台就大声发了言。","o":["大胆","大多","大力","大批"],"a":0,"say":"大胆","sent":"她很大胆，第一次上台就大声发了言。","ex":"大胆 dàdǎn — bold, daring · 她很大胆，第一次上台就大声发了言。 / She is very bold: the first time she went on stage, she spoke in a loud voice.","sent_en":"She is very bold: the first time she went on stage, she spoke in a loud voice."},{"t":"mc var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");
  b.type="button";b.setAttribute("aria-label","Pronounce");b.textContent="🔊";
  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
