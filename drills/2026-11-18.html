<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"电商","py":"diànshāng","say":"电商","o":["e-commerce","television station","electronic version","to transfer, to move"],"a":0,"sent":"现在很多人喜欢在电商平台上买东西，因为又快又方便。","sent_en":"Many people now like to buy things on e-commerce platforms, because it is both fast and convenient.","ex":"电商 diànshāng — e-commerce · 现在很多人喜欢在电商平台上买东西，因为又快又方便。 / Many people now like to buy things on e-commerce platforms, because it is both fast and convenient. (电商 is short for 电子商务)"},{"t":"mc","q":"电视台","py":"diànshìtái","say":"电视台","o":["e-commerce","television station","electronic version","animation, cartoon"],"a":1,"sent":"晚上七点，电视台会播放新闻节目。","sent_en":"At seven in the evening, the television station will broadcast the news programme.","ex":"电视台 diànshìtái — television station · 晚上七点，电视台会播放新闻节目。 / At seven in the evening, the television station will broadcast the news programme."},{"t":"mc","q":"电子版","py":"diànzǐbǎn","say":"电子版","o":["television station","to invent; invention","electronic version","QR code"],"a":2,"sent":"这本书不但有纸质版，还有电子版，可以在手机上阅读。","sent_en":"This book has not only a paper edition, but also an electronic version that you can read on your phone.","ex":"电子版 diànzǐbǎn — electronic version · 这本书不但有纸质版，还有电子版，可以在手机上阅读。 / This book has not only a paper edition, but also an electronic version that you can read on your phone."},{"t":"mc","q":"调","py":"diào","say":"调","o":["to investigate","to freeze","to hide, to avoid","to transfer, to move; tone"],"a":3,"sent":"公司决定把她调到北京的分公司工作。","sent_en":"The company decided to transfer her to the branch office in Beijing.","ex":"调 diào — to transfer, to move; tone · 公司决定把她调到北京的分公司工作。 / The company decided to transfer her to the branch office in Beijing. (here 调 is 4th tone diào, ‘to transfer’. Another common reading is tiáo, ‘to adjust’, which appears later in the HSK 5 list)"},{"t":"mc","q":"调研","py":"diàoyán","say":"调研","o":["to investigate, to conduct research","to transfer, to move","to publish, to issue","to release, to announce"],"a":0,"sent":"为了了解学生的需要，老师做了一次调研。","sent_en":"To understand the students' needs, the teacher carried out a survey.","ex":"调研 diàoyán — to investigate, to conduct research · 为了了解学生的需要，老师做了一次调研。 / To understand the students' needs, the teacher carried out a survey."},{"t":"mc","q":"定期","py":"dìngqī","say":"定期","o":["short term; short-term","regular; to schedule regularly","to lose, to be missing","to break, to cut off"],"a":1,"sent":"医生建议他定期检查身体，保持健康。","sent_en":"The doctor advised him to have regular check-ups to stay healthy.","ex":"定期 dìngqī — regular; to schedule regularly · 医生建议他定期检查身体，保持健康。 / The doctor advised him to have regular check-ups to stay healthy. (定期 is regular / at fixed times; 短期 is short-term)"},{"t":"mc","q":"丢失","py":"diūshī","say":"丢失","o":["to freeze","to hide, to avoid","to lose, to be missing","to block, to clog"],"a":2,"sent":"他不小心丢失了钱包，里面有身份证和一些现金。","sent_en":"He accidentally lost his wallet, which had his ID card and some cash in it.","ex":"丢失 diūshī — to lose, to be missing · 他不小心丢失了钱包，里面有身份证和一些现金。 / He accidentally lost his wallet, which had his ID card and some cash in it."},{"t":"mc","q":"冻","py":"dòng","say":"冻","o":["hole, cave","to start work, to take action","moving, touching","to freeze"],"a":3,"sent":"今天太冷了，湖面上的水都冻住了。","sent_en":"It is so cold today that the water on the lake has frozen.","ex":"冻 dòng — to freeze · 今天太冷了，湖面上的水都冻住了。 / It is so cold today that the water on the lake has frozen. (冻 and 洞 have the same pinyin dòng, but 冻 is a verb ‘to freeze’, and 洞 is a noun ‘hole, cave’)"},{"t":"mc","q":"独特","py":"dútè","say":"独特","o":["unique, distinctive","to be independent; independent","alone, by oneself","pronunciation"],"a":0,"sent":"济南的泉水有独特的美，许多诗都描写过它们。","sent_en":"The springs of Jinan have a unique beauty, and many poems have described them.","ex":"独特 dútè — unique, distinctive · 济南的泉水有独特的美，许多诗都描写过它们。 / The springs of Jinan have a unique beauty, and many poems have described them. (also in textbook Lesson 5; 独特 is unique, 独立 is independent, 独自 is alone)"},{"t":"mc","q":"独立","py":"dúlì","say":"独立","o":["unique, distinctive","to be independent; independent","alone, by oneself","to treat, to handle"],"a":1,"sent":"她大学毕业以后，希望能够独立生活，不再依靠父母。","sent_en":"After graduating from university, she hopes to be able to live independently and no longer depend on her parents.","ex":"独立 dúlì — to be independent; independent · 她大学毕业以后，希望能够独立生活，不再依靠父母。 / After graduating from university, she hopes to be able to live independently and no longer depend on her parents."}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"animation, cartoon","py":"dònghuà","say":"动画","o":["动人","动手","动画","冻"],"a":2,"ex":"动画 dònghuà — animation, cartoon · 孩子们最喜欢看这部有趣的动画。 / The children like watching this interesting animation the most.","sent":"孩子们最喜欢看这部有趣的动画。","sent_en":"The children like watching this interesting animation the most."},{"t":"mc","q":"moving, touching","py":"dòngrén","say":"动人","o":["动人","动手","动画","独特"],"a":0,"ex":"动人 dòngrén — moving, touching · 她的演讲非常动人，听完以后很多人都哭了。 / Her speech was so moving that many people cried after listening to it.","sent":"她的演讲非常动人，听完以后很多人都哭了。","sent_en":"Her speech was so moving that many people cried after listening to it."},{"t":"mc","q":"to start work, to take action","py":"dòngshǒu","say":"动手","o":["动人","动手","动画","独立"],"a":1,"ex":"动手 dòngshǒu — to start work, to take action · 与其一直讨论，不如现在就动手做实验。 / Rather than keeping on discussing, it is better to start the experiment now.","sent":"与其一直讨论，不如现在就动手做实验。","sent_en":"Rather than keeping on discussing, it is better to start the experiment now."},{"t":"mc","q":"tofu","py":"dòufu","say":"豆腐","o":["豆浆","独自","读音","豆腐"],"a":3,"ex":"豆腐 dòufu — tofu · 晚饭我们吃了麻婆豆腐和青菜。 / For dinner we had mapo tofu and green vegetables. (fu is a neutral tone: dòufu, not dòufǔ)","sent":"晚饭我们吃了麻婆豆腐和青菜。","sent_en":"For dinner we had mapo tofu and green vegetables."},{"t":"mc","q":"soy milk","py":"dòujiāng","say":"豆浆","o":["豆浆","豆腐","独自","读音"],"a":0,"ex":"豆浆 dòujiāng — soy milk · 早上我通常喝一杯热豆浆，再吃一个鸡蛋。 / In the morning I usually drink a cup of hot soy milk and then eat an egg.","sent":"早上我通常喝一杯热豆浆，再吃一个鸡蛋。","sent_en":"In the morning I usually drink a cup of hot soy milk and then eat an egg."},{"t":"mc","q":"pronunciation","py":"dúyīn","say":"读音","o":["独自","独特","读音","独立"],"a":2,"ex":"读音 dúyīn — pronunciation · 这个字有两个读音，你要先看句子再决定。 / This character has two pronunciations; you should look at the sentence first before deciding.","sent":"这个字有两个读音，你要先看句子再决定。","sent_en":"This character has two pronunciations; you should look at the sentence first before deciding."},{"t":"mc","q":"alone, by oneself","py":"dúzì","say":"独自","o":["独特","独自","独立","读音"],"a":1,"ex":"独自 dúzì — alone, by oneself · 他喜欢独自坐在窗边看书，外面的声音好像都消失了。 / He likes sitting by the window and reading alone; the sounds outside seem to disappear. (独自 is alone; 独立 is independent; 独特 is unique)","sent":"他喜欢独自坐在窗边看书，外面的声音好像都消失了。","sent_en":"He likes sitting by the window and reading alone; the sounds outside seem to disappear."}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"山里有一个很深的____，小时候我们常进去玩。","o":["冻","洞","堵","断"],"a":1,"say":"洞","sent":"山里有一个很深的洞，小时候我们常进去玩。","ex":"洞 dòng — hole, cave · 山里有一个很深的洞，小时候我们常进去玩。 / There is a very deep cave in the mountains, and we often went in to play when we were little. (洞 is a noun; 冻 dòng means ‘to freeze’)","sent_en":"There is a very deep cave in the mountains, and we often went in to play when we were little."},{"t":"mc","q":"早高峰的时候，这条路上经常____车。","o":["堵","断","堆","洞"],"a":0,"say":"堵","sent":"早高峰的时候，这条路上经常堵车。","ex":"堵 dǔ — to block, to clog; blocked · 早高峰的时候，这条路上经常堵车。 / During the morning rush hour, this road is often jammed. (堵 is 3rd tone dǔ; 度 dù is 4th tone)","sent_en":"During the morning rush hour, this road is often jammed."},{"t":"mc","q":"刮风的时候，树上的一根树枝____了。","o":["堵","堆","断","冻"],"a":2,"say":"断","sent":"刮风的时候，树上的一根树枝断了。","ex":"断 duàn — to break, to cut off · 刮风的时候，树上的一根树枝断了。 / When the wind blew, a branch on the tree broke.","sent_en":"When the wind blew, a branch on the tree broke."},{"t":"mc","q":"院子里____着很多落叶，看起来像一座小山。","o":["堵","断","躲","堆"],"a":3,"say":"堆","sent":"院子里堆着很多落叶，看起来像一座小山。","ex":"堆 duī — to pile up; pile · 院子里堆着很多落叶，看起来像一座小山。 / A lot of fallen leaves were piled up in the yard, and they looked like a small hill.","sent_en":"A lot of fallen leaves were piled up in the yard, and they looked like a small hill."},{"t":"mc","q":"请把这两张照片放在一起____一下，看看有什么不同。","o":["对待","对比","对象","对手"],"a":1,"say":"对比","sent":"请把这两张照片放在一起对比一下，看看有什么不同。","ex":"对比 duìbǐ — to compare; comparison, contrast · 请把这两张照片放在一起对比一下，看看有什么不同。 / Please put these two photos together and compare them, and see what is different.","sent_en":"Please put these two photos together and compare them, and see what is different."},{"t":"mc","q":"老师____每一个学生都很公平，不会偏心。","o":["对待","对比","对手","对象"],"a":0,"say":"对待","sent":"老师对待每一个学生都很公平，不会偏心。","ex":"对待 duìdài — to treat, to handle · 老师对待每一个学生都很公平，不会偏心。 / The teacher treats every student fairly and does not take sides.","sent_en":"The teacher treats every student fairly and does not take sides."}]},{"title":"四、易混词 Look-alikes in sentences","hint":"choose the word that fits · 🔊","items":[{"t":"mc","q":"每个人都有长处和____，重要的是学会互补。","o":["短处","短期","断","堆"],"a":0,"say":"短处","sent":"每个人都有长处和短处，重要的是学会互补。","ex":"短处 duǎnchù — shortcoming, weakness · 每个人都有长处和短处，重要的是学会互补。 / Everyone has strengths and weaknesses; the important thing is to learn to complement one another. (短处 is a shortcoming; 短期 is a short period of time)","sent_en":"Everyone has strengths and weaknesses; the important thing is to learn to complement one another."},{"t":"mc","q":"这个____课程只有两个星期，但收获很大。","o":["短处","短期","断","定期"],"a":1,"say":"短期","sent":"这个短期课程只有两个星期，但收获很大。","ex":"短期 duǎnqī — short term; short-term · 这个短期课程只有两个星期，但收获很大。 / This short-term course lasts only two weeks, but the gains are great. (短期 is short-term; 定期 means regular / at fixed times)","sent_en":"This short-term course lasts only two weeks, but the gains are great."},{"t":"mc","q":"这场比赛的____很强，我们必须认真准备。","o":["对象","队伍","对手","对待"],"a":2,"say":"对手","sent":"这场比赛的对手很强，我们必须认真准备。","ex":"对手 duìshǒu — opponent, adversary · 这场比赛的对手很强，我们必须认真准备。 / The opponent in this match is very strong, so we must prepare carefully. (对手 is an opponent; 对象 is an object or a partner; 队伍 is a team)","sent_en":"The opponent in this match is very strong, so we must prepare carefully."},{"t":"mc","q":"这项调研的____是附近的中学生和他们的家长。","o":["对手","队伍","对待","对象"],"a":3,"say":"对象","sent":"这项调研的对象是附近的中学生和他们的家长。","ex":"对象 duìxiàng — object, partner, boyfriend/girlfriend · 这项调研的对象是附近的中学生和他们的家长。 / The subjects of this survey are nearby secondary-school students and their parents. (here 对象 means the object / target of the research; it can also mean a boyfriend or girlfriend)","sent_en":"The subjects of this survey are nearby secondary-school students and their parents."},{"t":"mc","q":"她在学校杂志上____了一篇关于环保的文章。","o":["发表","发布","发明","发挥"],"a":0,"say":"发表","sent":"她在学校杂志上发表了一篇关于环保的文章。","ex":"发表 fābiǎo — to publish, to issue · 她在学校杂志上发表了一篇关于环保的文章。 / She published an article about environmental protection in the school magazine. (发表 is to publish an article or an opinion; 发布 is to release news, a notice or a product)","sent_en":"She published an article about environmental protection in the school magazine."},{"t":"mc","q":"学校昨天____了下周运动会的通知。","o":["发表","发布","发达","发明"],"a":1,"say":"发布","sent":"学校昨天发布了下周运动会的通知。","ex":"发布 fābù — to release, to announce · 学校昨天发布了下周运动会的通知。 / The school released the notice for next week's sports day yesterday. (发布 a notice or news; 发表 an article or a view)","sent_en":"The school released the notice for next week's sports day yesterday."},{"t":"mc","q":"下雨了，行人赶忙____进附近的商店。","o":["朵","冻","躲","洞"],"a":2," var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");

  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}

 document.getElementById("quiz").classList.add("locked");

 var r=document.getElementById("result");r.style.display="block";r.innerHTML="";

<script>
(function(){
  var KEY="alexa-chinese-scores";
  function drillId(){
    var m=(location.pathname||"").match(/([^/]+)\.html$/i);
    return m?decodeURIComponent(m[1]):null;
  }
  function save(){
    var r=document.getElementById("result");
    if(!r)return;
    var text=r.textContent||"";
    var m=text.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i)||text.match(/得分[^0-9]*(\d+)\s*\/\s*(\d+)/);
    if(!m)return;
    var id=drillId();
    if(!id)return;
    var score=+m[1], total=+m[2];
    if(!(total>0) || !(score>=0) || score>total)return;
    try{
      var all={};
      try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
      if(typeof all!=="object"||Array.isArray(all)) all={};
      all[id]={score:score,total:total,at:new Date().toISOString()};
      localStorage.setItem(KEY,JSON.stringify(all));
    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
<!-- /PWA-SCRIPT -->
