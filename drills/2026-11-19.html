var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"发起","py":"fāqǐ","say":"发起","o":["to initiate, to launch","to speak; speech","to pronounce; pronunciation","to turn over, to flip"],"a":0,"sent":"学校发起了一场环保活动，希望每个同学都参加。","sent_en":"The school launched an environmental-protection activity, hoping that every classmate would take part.","ex":"发起 fāqǐ — to initiate, to launch · 学校发起了一场环保活动，希望每个同学都参加。 / The school launched an environmental-protection activity, hoping that every classmate would take part."},{"t":"mc","q":"发言","py":"fāyán","say":"发言","o":["to initiate, to launch","to speak; speech","to pronounce; pronunciation","to share"],"a":1,"sent":"会议上，老师请她代表小组发言。","sent_en":"At the meeting, the teacher asked her to speak on behalf of the group.","ex":"发言 fāyán — to speak; speech · 会议上，老师请她代表小组发言。 / At the meeting, the teacher asked her to speak on behalf of the group. (发言 is to give a speech; 发音 is pronunciation)"},{"t":"mc","q":"发音","py":"fāyīn","say":"发音","o":["to speak; speech","to analyze","to pronounce; pronunciation","to share"],"a":2,"sent":"这个字的发音不太一样，请你再听一遍。","sent_en":"The pronunciation of this character is a little different; please listen to it once more.","ex":"发音 fāyīn — to pronounce; pronunciation · 这个字的发音不太一样，请你再听一遍。 / The pronunciation of this character is a little different; please listen to it once more. (发音 is pronunciation; 发言 is to speak at a meeting)"},{"t":"mc","q":"罚","py":"fá","say":"罚","o":["to fine; fine","court, law court","to turn over, to flip","to punish, to fine"],"a":3,"sent":"如果上课迟到，老师会罚他打扫教室。","sent_en":"If he is late for class, the teacher will punish him by having him clean the classroom.","ex":"罚 fá — to punish, to fine · 如果上课迟到，老师会罚他打扫教室。 / If he is late for class, the teacher will punish him by having him clean the classroom. (罚 is the general verb ‘to punish’; 罚款 is specifically a money fine)"},{"t":"mc","q":"罚款","py":"fákuǎn","say":"罚款","o":["to fine; fine","to punish, to fine","court, law court","plan, scheme"],"a":0,"sent":"在这里乱停车会被罚款。","sent_en":"Parking illegally here will get you fined.","ex":"罚款 fákuǎn — to fine; fine · 在这里乱停车会被罚款。 / Parking illegally here will get you fined."},{"t":"mc","q":"法院","py":"fǎyuàn","say":"法院","o":["to fine; fine","court, law court","house, building","to visit"],"a":1,"sent":"这份合同如果出现问题，也许要拿到法院去处理。","sent_en":"If a problem comes up with this contract, it may have to be taken to court to be dealt with.","ex":"法院 fǎyuàn — court, law court · 这份合同如果出现问题，也许要拿到法院去处理。 / If a problem comes up with this contract, it may have to be taken to court to be dealt with."},{"t":"mc","q":"翻","py":"fān","say":"翻","o":["tomato","opposite; to oppose","to turn over, to flip","to return, to turn back"],"a":2,"sent":"请把书翻到第二十页，我们一起看课文。","sent_en":"Please turn the book to page 20, and we will look at the text together.","ex":"翻 fān — to turn over, to flip · 请把书翻到第二十页，我们一起看课文。 / Please turn the book to page 20, and we will look at the text together. (翻 is to turn/flip; 反 means opposite / to oppose)"},{"t":"mc","q":"番茄","py":"fānqié","say":"番茄","o":["to turn over, to flip","prosperous; to prosper","style","tomato"],"a":3,"sent":"沙拉里有新鲜的番茄和黄瓜。","sent_en":"There are fresh tomatoes and cucumbers in the salad.","ex":"番茄 fānqié — tomato · 沙拉里有新鲜的番茄和黄瓜。 / There are fresh tomatoes and cucumbers in the salad."},{"t":"mc","q":"繁荣","py":"fánróng","say":"繁荣","o":["prosperous; to prosper","rich and colorful","style","crazy, insane"],"a":0,"sent":"改革开放以来，这座城市变得越来越繁荣。","sent_en":"Since the reform and opening-up, this city has become more and more prosperous.","ex":"繁荣 fánróng — prosperous; to prosper · 改革开放以来，这座城市变得越来越繁荣。 / Since the reform and opening-up, this city has become more and more prosperous."},{"t":"mc","q":"反而","py":"fǎn’ér","say":"反而","o":["anyway, in any case","on the contrary, instead","repeatedly; to repeat","to return, to turn back"],"a":1,"sent":"他不但没有休息，反而工作到了半夜。","sent_en":"Not only did he not rest; on the contrary, he worked until midnight.","ex":"反而 fǎn’ér — on the contrary, instead · 他不但没有休息，反而工作到了半夜。 / Not only did he not rest; on the contrary, he worked until midnight. (also in textbook Lesson 4; often used in 不但没有…反而…)"}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"opposite; to oppose; on the contrary","py":"fǎn","say":"反","o":["翻","罚","反","方"],"a":2,"ex":"反 fǎn — opposite; to oppose; on the contrary · 请看卡片的反面，那里写着英文解释。 / Please look at the back of the card; the English explanation is written there.","sent":"请看卡片的反面，那里写着英文解释。","sent_en":"Please look at the back of the card; the English explanation is written there."},{"t":"mc","q":"repeatedly; to repeat; repetition","py":"fǎnfù","say":"反复","o":["反复","返回","反正","反而"],"a":0,"ex":"反复 fǎnfù — repeatedly; to repeat; repetition · 这首诗她反复读了好几遍，终于记住了。 / She read this poem through repeatedly several times, and finally remembered it.","sent":"这首诗她反复读了好几遍，终于记住了。","sent_en":"She read this poem through repeatedly several times, and finally remembered it."},{"t":"mc","q":"to return, to turn back","py":"fǎnhuí","say":"返回","o":["反复","返回","反应","反映"],"a":1,"ex":"返回 fǎnhuí — to return, to turn back · 参观结束后，我们原路返回学校。 / After the visit ended, we returned to school the way we had come.","sent":"参观结束后，我们原路返回学校。","sent_en":"After the visit ended, we returned to school the way we had come."},{"t":"mc","q":"to react; reaction, response","py":"fǎnyìng","say":"反应","o":["反映","返回","反正","反应"],"a":3,"ex":"反应 fǎnyìng — to react; reaction, response · 听到这个消息，大家的反应都不一样。 / On hearing this news, everyone’s reactions were different. (反应 is a reaction; 反映 is to reflect / to report. They have the same pinyin.)","sent":"听到这个消息，大家的反应都不一样。","sent_en":"On hearing this news, everyone’s reactions were different."},{"t":"mc","q":"to reflect, to report","py":"fǎnyìng","say":"反映","o":["反应","反复","反映","反正"],"a":2,"ex":"反映 fǎnyìng — to reflect, to report · 这篇作文反映了她对家乡的热爱。 / This composition reflects her love for her hometown. (also in textbook Lesson 5; 反映 mirrors a situation or reports it; 反应 is a reaction)","sent":"这篇作文反映了她对家乡的热爱。","sent_en":"This composition reflects her love for her hometown."},{"t":"mc","q":"anyway, in any case","py":"fǎnzhèng","say":"反正","o":["反正","反而","反复","返回"],"a":0,"ex":"反正 fǎnzhèng — anyway, in any case · 反正今天已经晚了，我们明天再去吧。 / Anyway, it is already late today, so let’s go tomorrow instead.","sent":"反正今天已经晚了，我们明天再去吧。","sent_en":"Anyway, it is already late today, so let’s go tomorrow instead."},{"t":"mc","q":"scope, range","py":"fànwéi","say":"范围","o":["方案","范围","房屋","方"],"a":1,"ex":"范围 fànwéi — scope, range · 这次考试的范围包括前五课的词汇。 / The scope of this exam includes the vocabulary from the first five lessons.","sent":"这次考试的范围包括前五课的词汇。","sent_en":"The scope of this exam includes the vocabulary from the first five lessons."}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"拍照的时候，请站在我的左____，这样画面更完整。","o":["方","方案","房屋","防"],"a":0,"say":"方","sent":"拍照的时候，请站在我的左方，这样画面更完整。","sent_en":"When we take the photo, please stand to my left, so that the picture is more complete.","ex":"方 fāng — square; direction, side · 拍照的时候，请站在我的左方，这样画面更完整。 / When we take the photo, please stand to my left, so that the picture is more complete. (左方 / 右方 = the left / right side)"},{"t":"mc","q":"老师提出了一个新的学习____，大家觉得很有用。","o":["方","方案","范围","房屋"],"a":1,"say":"方案","sent":"老师提出了一个新的学习方案，大家觉得很有用。","sent_en":"The teacher put forward a new study plan, and everyone found it very useful.","ex":"方案 fāng’àn — plan, scheme · 老师提出了一个新的学习方案，大家觉得很有用。 / The teacher put forward a new study plan, and everyone found it very useful."},{"t":"mc","q":"冬天要做好准备，注意____病，出门记得穿得暖和一点。","o":["防止","仿佛","防","方案"],"a":2,"say":"防","sent":"冬天要做好准备，注意防病，出门记得穿得暖和一点。","sent_en":"In winter you should be well prepared and take care to prevent illness; remember to dress warmly when you go out.","ex":"防 fáng — to prevent var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");
  b.type="button";b.setAttribute("aria-label","Pronounce");b.textContent="🔊";
  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}

<script>
(function(){
  var KEY="alexa-chinese-scores";
  function drillId(){
    var m=(location.pathname||"").match(/([^/]+)\.html$/i);
    return m?decodeURIComponent(m[1]):null;
  }
  function save(){
    var r=document.getElementById("result");
    if(!r)return;
    var text=r.textContent||"";
    var m=text.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i)||text.match(/得分[^0-9]*(\d+)\s*\/\s*(\d+)/);
    if(!m)return;
    var id=drillId();
    if(!id)return;
    var score=+m[1], total=+m[2];
    if(!(total>0) || !(score>=0) || score>total)return;
    try{
      var all={};
      try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
      if(typeof all!=="object"||Array.isArray(all)) all={};
      all[id]={score:score,total:total,at:new Date().toISOString()};
      localStorage.setItem(KEY,JSON.stringify(all));
    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
