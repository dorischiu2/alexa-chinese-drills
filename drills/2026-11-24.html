<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"激烈","o":["to concentrate","fierce, intense","to pass an exam","to gather, to assemble"],"a":1,"say":"激烈","sent":"学校要举行一场极其激烈的机器人比赛。","sent_en":"The school was going to hold an extremely intense robot competition.","ex":"激烈 jīliè — fierce, intense · 学校要举行一场极其激烈的机器人比赛。 / The school was going to hold an extremely intense robot competition. (激烈 describes a strong, intense contest or argument; 集中 means to concentrate)","py":"jīliè"},{"t":"mc","q":"机器","o":["robot","computer","machine","household appliances"],"a":2,"say":"机器","sent":"教室里的机器和计算机都已经准备好了。","sent_en":"The machines and computers in the classroom were already ready.","ex":"机器 jīqì — machine · 教室里的机器和计算机都已经准备好了。 / The machines and computers in the classroom were already ready. (机器 is a machine; 机器人 is a robot; 计算机 is a computer; 家电 means household appliances)","py":"jīqì"},{"t":"mc","q":"机器人","o":["robot","machine","computer","muscle"],"a":0,"say":"机器人","sent":"选手们用自己的技能控制机器人。","sent_en":"The contestants used their own skills to control the robots.","ex":"机器人 jīqìrén — robot · 选手们用自己的技能控制机器人。 / The contestants used their own skills to control the robots. (机器人 is a robot, a machine that looks or acts somewhat like a person; 机器 is a machine in general)","py":"jīqìrén"},{"t":"mc","q":"肌肉","o":["disease","memory","skill","muscle"],"a":3,"say":"肌肉","sent":"选手们的肌肉都绷得很紧。","sent_en":"The contestants' muscles were all tensed very tightly.","ex":"肌肉 jīròu — muscle · 选手们的肌肉都绷得很紧。 / The contestants' muscles were all tensed very tightly. (肌肉 is muscle; do not confuse it with 疾病, disease, which also starts with jí)","py":"jīròu"},{"t":"mc","q":"及","o":["level, grade","and, as well as","to pass an exam","collection, episode"],"a":1,"say":"及","sent":"教室里的机器、计算机及一架模型都已经准备好了。","sent_en":"The machines, computers and a model in the classroom were already ready.","ex":"及 jí — and, as well as · 教室里的机器、计算机及一架模型都已经准备好了。 / The machines, computers and a model in the classroom were already ready. (及 is a slightly formal way to say 'and / as well as'; 及格 means to pass an exam; 级 means a level or grade)","py":"jí"},{"t":"mc","q":"级","o":["and, as well as","to pass an exam","level, grade","to gather, to assemble"],"a":2,"say":"级","sent":"老师让五年级的同学先在大厅集合。","sent_en":"The teacher asked the fifth-grade students to assemble in the hall first.","ex":"级 jí — level, grade · 老师让五年级的同学先在大厅集合。 / The teacher asked the fifth-grade students to assemble in the hall first. (级 is a grade or level, as in 五年级 or 提高一级; 及 means 'and'; 及格 means to pass an exam)","py":"jí"},{"t":"mc","q":"集","o":["level, grade","collection, volume; episode","to gather, to assemble","collective, group"],"a":1,"say":"集","sent":"片子的第一集记载了一位科学家的故事。","sent_en":"The first episode of the film recorded the story of a scientist.","ex":"集 jí — collection, volume; episode · 片子的第一集记载了一位科学家的故事。 / The first episode of the film recorded the story of a scientist. (集 can mean a collection, or an episode of a film or series, as in 第一集; 集合 means to gather; 集体 means a group or collective)","py":"jí"},{"t":"mc","q":"疾病","o":["emergency treatment","muscle","disease","memory"],"a":2,"say":"疾病","sent":"有的疾病来得很快，可能需要去做急诊。","sent_en":"Some diseases come on very quickly, and one may need to go for emergency treatment.","ex":"疾病 jíbìng — disease · 有的疾病来得很快，可能需要去做急诊。 / Some diseases come on very quickly, and one may need to go for emergency treatment. (疾病 is illness or disease; 急诊 is emergency treatment, or an emergency case)","py":"jíbìng"},{"t":"mc","q":"及格","o":["to pass an exam","and, as well as","to urgently need","to concentrate"],"a":0,"say":"及格","sent":"及格只是最低要求。","sent_en":"Passing is only the minimum requirement.","ex":"及格 jígé — to pass an exam · 及格只是最低要求。 / Passing is only the minimum requirement. (及格 means to reach the pass mark; 及 by itself means 'and / as well as')","py":"jígé"},{"t":"mc","q":"集合","o":["collective, group","to concentrate","to pass an exam","to gather, to assemble"],"a":3,"say":"集合","sent":"老师让五年级的同学先在大厅集合。","sent_en":"The teacher asked the fifth-grade students to assemble in the hall first.","ex":"集合 jíhé — to gather, to assemble · 老师让五年级的同学先在大厅集合。 / The teacher asked the fifth-grade students to assemble in the hall first. (集合 is to gather in one place; 集体 is a group or collective; 集中 means to concentrate)","py":"jíhé"}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"soon, about to","o":["即将","急忙","极其","集中"],"a":0,"say":"即将","sent":"比赛即将开始。","sent_en":"The competition was about to start.","ex":"即将 jíjiāng — soon, about to · 比赛即将开始。 / The competition was about to start. (即将 means something is just about to happen; 急忙 means hurriedly)","py":"jíjiāng"},{"t":"mc","q":"hurriedly, hastily","o":["即将","急忙","急需","急诊"],"a":1,"say":"急忙","sent":"大家急忙走进大厅。","sent_en":"Everyone hurried into the hall.","ex":"急忙 jímáng — hurriedly, hastily · 大家急忙走进大厅。 / Everyone hurried into the hall. (急忙 describes doing something in a hurry; 即将 means 'about to'; 急需 means to need something urgently)","py":"jímáng"},{"t":"mc","q":"extremely","o":["急忙","即将","极其","集中"],"a":2,"say":"极其","sent":"学校要举行一场极其激烈的机器人比赛。","sent_en":"The school was going to hold an extremely intense robot competition.","ex":"极其 jíqí — extremely · 学校要举行一场极其激烈的机器人比赛。 / The school was going to hold an extremely intense robot competition. (极其 is a strong 'extremely', often used before an adjective such as 激烈)","py":"jíqí"},{"t":"mc","q":"collective, group","o":["集合","集中","集","集体"],"a":3,"say":"集体","sent":"Alexa和集体的队员站在一起。","sent_en":"Alexa stood together with the teammates of the group.","ex":"集体 jítǐ — collective, group · Alexa和集体的队员站在一起。 / Alexa stood together with the teammates of the group. (集体 is a group or collective, as in 集体活动 / 集体的队员; 集合 is the verb 'to assemble')","py":"jítǐ"},{"t":"mc","q":"to urgently need","o":["急需","急诊","急忙","及格"],"a":0,"say":"急需","sent":"学校急需一些常用药品。","sent_en":"The school urgently needed some commonly used medicines.","ex":"急需 jíxū — to urgently need · 学校急需一些常用药品。 / The school urgently needed some commonly used medicines. (急需 is to need something very urgently; 急诊 is emergency medical treatment)","py":"jíxū"},{"t":"mc","q":"emergency treatment; emergency case","o":["疾病","急诊","急需","记忆"],"a":1,"say":"急诊","sent":"有的疾病来得很快，可能需要去做急诊。","sent_en":"Some diseases come on very quickly, and one may need to go for emergency treatment.","ex":"急诊 jízhěn — emergency treatment; emergency case · 有的疾病来得很快，可能需要去做急诊。 / Some diseases come on very quickly, and one may need to go for emergency treatment. (急诊 is emergency treatment, or the emergency department, as in 急诊科; 疾病 is disease; 急需 is to need something urgently)","py":"jízhěn"},{"t":"mc","q":"to concentrate; concentrated","o":["集合","集体","集中","集"],"a":2,"say":"集中","sent":"选手们必须集中精神，用自己的技能控制机器人。","sent_en":"The contestants had to concentrate, and use their own skills to control the robots.","ex":"集中 jízhōng — to concentrate; concentrated · 选手们必须集中精神，用自己的技能控制机器人。 / The contestants had to concentrate, and use their own skills to control the robots. (集中精神 means to focus one's mind; 集合 is to gather; 集体 is a group)","py":"jízhōng"}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"大厅里有点儿____，大家走的时候都很小心。","o":["挤","系","集中","急忙"],"a":0,"say":"挤","sent":"大厅里有点儿挤，大家走的时候都很小心。","sent_en":"The hall was a bit crowded, and everyone was very careful when walking.","ex":"挤 jǐ — to crowd, to squeeze; crowded · 大厅里有点儿挤，大家走的时候都很小心。 / The hall was a bit crowded, and everyone was very careful when walking. (挤 can be an adjective meaning crowded, or a verb meaning to squeeze / to crowd; the tone is 3rd-tone jǐ, not 2nd-tone jí)","py":"jǐ"},{"t":"mc","q":"Alexa____上号码牌，和集体的队员站在一起。","o":["挤","系","集","级"],"a":1,"say":"系","sent":"Alexa系上号码牌，和集体的队员站在一起。","sent_en":"Alexa tied on her number tag and stood together with the teammates of the group.","ex":"系 jì — to tie, to fasten · Alexa系上号码牌，和集体的队员站在一起。 / Alexa tied on her number tag and stood together with the teammates of the group. (In this chunk 系 is 4th-tone jì, 'to tie / to fasten', as in 系鞋带 / 系上号码牌. Later you will also meet 系 xì, meaning a department or a system — same character, different reading.)","py":"jì"},{"t":"mc","q":"假如动作慢了，就很难打破上个____的纪录。","o":["记录","纪录","季度","纪念日"],"a":2,"say":"季度","sent":"假如动作慢了，就很难打破上个季度的纪录。","sent_en":"If their movements were slow, it would be very hard to break last quarter's record.","ex":"季度 jìdù — quarter (of a year) · 假如动作慢了，就很难打破上个季度的纪录。 / If their movements were slow, it would be very hard to break last quarter's record. (一个季度 is three months, as in 上个季度 / 这个季度; 纪录, with 糸 on the left of 纪, is an achievement record)","py":"jìdù"},{"t":"mc","q":"裁判认真____选手的表现。","o":["纪录","记载","记忆","记录"],"a":3,"say":"记录","sent":"裁判认真记录选手的表现。","sent_en":"The referee carefully recorded the contestants' performance.","ex":"记录 jìlù — to record; record · 裁判认真记录选手的表现。 / The referee carefully recorded the contestants' performance. (记录, with 讠 on the left of 记, is to write something down, or that written record; 纪录 is an achievement record, as in 打破纪录; 记载 is to record in a document or in history — also in textbook Lesson 5 济南的泉水)","py":"jìlù"},{"t":"mc","q":"假如动作慢了，就很难打破上个季度的____。","o":["纪录","记录","记载","纪录片"],"a":0,"say":"纪录","sent":"假如动作慢了，就很难打破上个季度的纪录。","sent_en":"If their movements were slow, it would be very hard to break last quarter's record.","ex":"纪录 jìlù — record as in achievement · 假如动作慢了，就很难打破上个季度的纪录。 / If their movements were slow, it would be very hard to break last quarter's record. (纪录 is a best result, as in 世界纪录 / 打破纪录; 记录 is to write something down. They have the same pinyin, but the first characters are different: 纪 vs 记)","py":"jìlù"},{"t":"mc","q":"比赛结束后，大家一起看了一部____。","o":["纪录","记录","纪录片","纪念日"],"a":2,"say":"纪录片","sent":"比赛结束后，大家一起看了一部纪录片。","sent_en":"After the competition ended, everyone watched a documentary together.","ex":"纪录片 jìlùpiàn — documentary · 比赛结束后，大家一起看了一部纪录片。 / After the competition ended, everyone watched a documentary together. (纪录片 is a documentary film; 片 is 4th-tone piàn. 纪录 by itself is an achievement record)","py":"jìlùpiàn"}]},{"title":"四、易混词 Look-alikes in sentences","hint":"choose the word that fits · 🔊","items":[{"t":"mc","q":"选手们必须集中精神，用自己的____控制机器人。","o":["记忆","技能","计算","机器"],"a":1,"say":"技能","sent":"选手们必须集中精神，用自己的技能控制机器人。","sent_en":"The contestants had to concentrate and use their own skills to control the robots.","ex":"技能 jìnéng — skill · 选手们必须集中精神，用自己的技能控制机器人。 / The contestants had to concentrate and use their own skills to control the robots. (技能 is a skill or ability that you can use; 记忆 is memory; 计算 is to calculate)","py":"jìnéng"},{"t":"mc","q":"人们用这种方式____那位科学家。","o":["记忆","记载","纪念","纪念日"],"a":2,"say":"纪念","sent":"人们用这种方式纪念那位科学家。","sent_en":"People commemorated that scientist in this way.","ex":"纪念 jìniàn — to commemorate; commemoration, souvenir · 人们用这种方式纪念那位科学家。 / People commemorated that scientist in this way. (纪念 is to honour the memory of a person or event; 纪念日 is an anniversary; 记忆 is memory in the mind)","py":"jìniàn"},{"t":"mc","q":"今天正好是学校的____。","o":["纪念","记忆","记载","纪念日"],"a":3,"say":"纪念日","sent":"今天正好是学校的纪念日。","sent_en":"Today happened to be the school's anniversary.","ex":"纪念日 jìniànrì — anniversary · 今天正好是学校的纪念日。 / Today happened to be the school's anniversary. (纪念日 is a special date for remembering something, an anniversary; 纪念 is the verb 'to commemorate')","py":"jìniànrì"},{"t":"mc","q":"裁判再用计算机快速____分数。","o":["计算","计算机","记录","记忆"],"a":0,"say":"计算","sent":"裁判再用计算机快速计算分数。","sent_en":"The referee then used a computer to calculate the scores quickly.","ex":"计算 jìsuàn — to calculate · 裁判再用计算机快速计算分数。 / The referee then used a computer to calculate the scores quickly. (计算 is the verb 'to calculate'; 计算机 is the machine, a computer)","py":"jìsuàn"},{"t":"mc","q":"教室里的机器和____都已经准备好了。","o":["计算","机器","计算机","机器人"],"a":2,"say":"计算机","sent":"教室里的机器和计算机都已经准备好了。","sent_en":"The machines and computers in the classroom were already ready.","ex":"计算机 jìsuànjī — computer · 教室里的机器和计算机都已经准备好了。 / The machines and computers in the classroom were already ready. (计算机 is a computer, literally a 'calculating machine'; 机器 is a machine; 机器人 is a robot; 计算 is the verb 'to calculate')","py":"jìsuànjī"},{"t":"mc","q":"他也希望同学们加深对科学的____和理解。","o":["纪念","记载","纪录","记忆"],"a":3,"say":"记忆","sent":"他也希望同学们加深对科学的记忆和理解。","sent_en":"He also hoped that the students would deepen their memory and understanding of science.","ex":"记忆 jìyì — to remember; memory · 他也希望同学们加深对科学的记忆和理解。 / He also hoped that the students would deepen their memory and understanding of science. (记忆 is what you remember, or the act of remembering; 纪念 is to commemorate; 记载 is to record in writing)","py":"jìyì"},{"t":"mc","q":"片子的第一集____了一位科学家的故事。","o":["记载","记录","纪录","记忆"],"a":0,"say":"记载","sent":"片子的第一集记载了一位科学家的故事。","sent_en":"The first episode of the film recorded the story of a scientist.","ex":"记载 jìzǎi — to record · 片子的第一集记载了一位科学家的故事。 / The first episode of the film recorded the story of a scientist. (also in textbook Lesson 5 济南的泉水; 记载 often means to record something in a document, a book or a film. 记录 is to write something down; 纪录 is an achievement record; 记忆 is memory)","py":"jìzǎi"}]},{"title":"五、默写 Dictation in context","hint":"🔊 listen, read the sentence, type the characters","items":[{"t":"text","q":"jiābīn — guest, honored guest","say":"嘉宾","sent":"中场时，一位____来到现场。","sent_en":"During the mid-event break, an honored guest arrived at the site.","a":["嘉宾"],"ex":"嘉宾 jiābīn — guest, honored guest · 中场时，一位嘉宾来到现场。 / During the mid-event break, an honored guest arrived at the site. (嘉宾 is an invited or honored guest, as in 特别嘉宾; 家电 means household appliances, and also starts with jiā)"},{"t":"text","q":"jiādiàn — household appliances","say":"家电","sent":"他改进了____和机器。","sent_en":"He improved household appliances and machines.","a" 级的同学先在大厅集合。大厅里有点儿挤，大家急忙走进来，Alexa系上号码牌，和集体的队员站在一起。教室里的机器、计算机及一架模型都已经准备好了。","这次比赛是在星期六举行的，大厅很空，大家走得很慢，谁也没有系号码牌。","老师让同学们先回家，教室里没有机器，也没有计算机。"],"a":0,"ex":"这个星期五，学校要举行一场极其激烈的机器人比赛。老师让五年级的同学先在大厅集合。大厅里有点儿挤，大家急忙走进来，Alexa系上号码牌，和集体的队员站在一起。教室里的机器、计算机及一架模型都已经准备好了。 / This Friday, the school was going to hold an extremely intense robot competition. The teacher asked the fifth-grade students to assemble in the hall first. The hall was a bit crowded, and everyone hurried in; Alexa tied on her number tag and stood together with the teammates of the group. The machines, computers and a model in the classroom were already ready."},{"t":"mc","q":"比赛进行时，选手和裁判做了什么？","o":["选手们不必集中精神，机器人也不会加热或加速，裁判没有记录成绩。","比赛即将开始。选手们必须集中精神，用自己的技能控制机器人。有的机器人会给零件加热，有的会把材料加工得更加平整，还有的能突然加速。场上的竞争十分激烈，选手们的肌肉都绷得很紧。假如动作慢了，就很难打破上个季度的纪录。裁判认真记录选手的表现，再用计算机快速计算分数。及格只是最低要求，大家真正想做的，是把技能再提高一级。","及格已经是最高目标，大家并不想再提高技能。"],"a":1,"ex":"比赛即将开始。选手们必须集中精神，用自己的技能控制机器人。有的机器人会给零件加热，有的会把材料加工得更加平整，还有的能突然加速。场上的竞争十分激烈，选手们的肌肉都绷得很紧。假如动作慢了，就很难打破上个季度的纪录。裁判认真记录选手的表现，再用计算机快速计算分数。及格只是最低要求，大家真正想做的，是把技能再提高一级。 / The competition was about to start. The contestants had to concentrate and use their own skills to control the robots. Some robots would heat the parts, some could process the materials so that they became even smoother, and others could suddenly speed up. The competition on the field was very intense, and the contestants' muscles were all tensed very tightly. If their movements were slow, it would be very hard to break last quarter's record. The referee carefully recorded the contestants' performance, and then used a computer to calculate the scores quickly. Passing was only the minimum requirement; what everyone really wanted to do was to raise their skills by one more level."},{"t":"mc","q":"那位嘉宾说了什么？","o":["那位嘉宾是计算机老师，他只谈了家电，没有谈药品和疾病。","他让同学们不要加深对科学的记忆，也不必爱护身体。","中场时，一位嘉宾来到现场。他是急诊科的医生。他告诉同学，学校急需一些常用药品；运动前要爱护身体，因为有的疾病来得很快，可能需要去做急诊。他也希望同学们加深对科学的记忆和理解。"],"a":2,"ex":"中场时，一位嘉宾来到现场。他是急诊科的医生。他告诉同学，学校急需一些常用药品；运动前要爱护身体，因为有的疾病来得很快，可能需要去做急诊。他也希望同学们加深对科学的记忆和理解。 / During the mid-event break, an honored guest arrived at the site. He was a doctor in the emergency department. He told the students that the school urgently needed some commonly used medicines; before sport they should take care of their bodies, because some diseases come on very quickly, and one may need to go for emergency treatment. He also hoped that the students would deepen their memory and understanding of science."},{"t":"mc","q":"比赛结束后，大家从纪录片里了解到什么？","o":["大家没有看电影，纪录片里也没有提到科学家或纪念日。","比赛结束后，大家一起看了一部纪录片。片子的第一集记载了一位科学家的故事：他改进了家电和机器，人们用这种方式纪念他。今天正好是学校的纪念日。纪录片里还提到，古人用“甲”表示第一。","纪录片只谈了家务，没有记载科学家的故事，也不是学校的纪念日。"],"a":1,"ex":"比赛结束后，大家一起看了一部纪录片。片子的第一集记载了一位科学家的故事：他改进了家电和机器，人们用这种方式纪念他。今天正好是学校的纪念日。纪录片里还提到，古人用“甲”表示第一。 / After the competition ended, everyone watched a documentary together. The first episode of the film recorded the story of a scientist: he improved household appliances and machines, and people commemorated him in this way. Today happened to be the school's anniversary. The documentary also mentioned that the ancients used 甲 to mean 'first'."},{"t":"mc","q":"Alexa回到家以后做了什么？","o":["回到家，Alexa做了一些家务，又把奖杯放到了架上。她想，这次比赛让她学到了很多。","回到家，Alexa什么家务也没做，并把奖杯放在了地上。","Alexa没有回家，她想这次比赛什么也没学到。"],"a":0,"ex":"回到家，Alexa做了一些家务，又把奖杯放到了架上。她想，这次比赛让她学到了很多。 / After she got home, Alexa did some household chores, and also put the trophy onto the shelf. She thought that she had learned a lot from this competition."}]}];

var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");
  b.type="button";b.setAttribute("aria-label","Pronounce");b.textContent="🔊";
  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}

<script>
(function(){
  var KEY="alexa-chinese-scores";
  function drillId(){
    var m=(location.pathname||"").match(/([^/]+)\.html$/i);
    return m?decodeURIComponent(m[1]):null;
  }
  function save(){
    var r=document.getElementById("result");
    if(!r)return;
    var text=r.textContent||"";
    var m=text.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i)||text.match(/得分[^0-9]*(\d+)\s*\/\s*(\d+)/);
    if(!m)return;
    var id=drillId();
    if(!id)return;
    var score=+m[1], total=+m[2];
    if(!(total>0) || !(score>=0) || score>total)return;
    try{
      var all={};
      try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
      if(typeof all!=="object"||Array.isArray(all)) all={};
      all[id]={score:score,total:total,at:new Date().toISOString()};
      localStorage.setItem(KEY,JSON.stringify(all));
    }catch(e){}
  }
  var btn=document.getElementById("check");
  if(btn) btn.addEventListener("click", function(){ try{save();}catch(e){} });
  if("serviceWorker" in navigator){
    var sw=new URL("../sw.js", location.href);
    var scope=new URL("../", location.href);
    navigator.serviceWorker.register(sw.href, {scope: scope.href}).catch(function(){});
  }
})();
</script>
<!-- /PWA-SCRIPT -->
