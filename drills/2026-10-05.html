<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexa 中文练习 – 5 Oct 2026 (Day 4)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#222;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:20px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4em;margin:.3em 0 0}
.sub{color:#666;font-size:.8em;margin-bottom:1em}
#timer{position:sticky;top:0;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:.85em;z-index:5;display:flex;justify-content:space-between}
section{background:#fff;border-radius:16px;padding:14px 16px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
h2{font-size:1.1em;margin:.2em 0 .5em}
h2 small{font-weight:normal;color:#777;font-size:.7em}
.item{padding:10px 8px;margin:8px 0;border-radius:12px;border:2px solid transparent}
.q{margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:1em;padding:10px 16px;border-radius:12px;border:2px solid #c9d4e3;background:#f8fbff;cursor:pointer;min-width:64px;font-family:inherit}
.opt.sel{background:#3b82f6;color:#fff;border-color:#3b82f6}
input.txt{font-size:1.1em;padding:8px 12px;border:2px solid #c9d4e3;border-radius:12px;width:10em;max-width:100%;font-family:inherit}
.passage{background:#fffbea;border-left:5px solid #f5c542;padding:10px 14px;border-radius:8px;font-size:1.05em}
.item.ok{border-color:#22c55e;background:#effdf3}
.item.bad{border-color:#ef4444;background:#fef1f1}
.fb{margin-top:6px;font-size:.85em;display:none}
.item.ok .fb,.item.bad .fb{display:block}
.item.ok .fb{color:#15803d}.item.bad .fb{color:#b91c1c}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.big{font-size:1.1em;padding:14px 24px;border:none;border-radius:14px;background:#16a34a;color:#fff;cursor:pointer;font-family:inherit}
.big.sec{background:#64748b}
#result{display:none;font-size:1.2em;text-align:center;background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.locked .opt,.locked input.txt{pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Alexa 中文练习 🌟 Day 4</h1>
<div class="sub">5 Oct 2026 · HSK标准教程 5(上) · Lesson 4 子路背米 (+ L5 review) · about 10 minutes</div>
<div id="timer"><span>⏱ <span id="clock">0:00</span></span><span id="prog"></span></div>
<div id="quiz"></div>
<div class="btns"><button class="big" id="check">✅ Check answers</button><button class="big sec" id="reset">↺ Try again</button></div>
<div id="result"></div>
</div>
<script>
var SECTIONS=[
 {title:"一、默写 Dictation",hint:"type the characters",items:[
  {t:"text",q:"xiàoshùn — filial / respectful to parents",a:["孝顺"],ex:"孝顺 xiàoshùn — 孝顺父母"},
  {t:"text",q:"dǎting — to ask about / inquire",a:["打听"],ex:"打听 dǎting — 打听消息"},
  {t:"text",q:"tuányuán — (family) be reunited",a:["团圆"],ex:"团圆 tuányuán — 一家人团圆"},
  {t:"text",q:"chéngkěn — sincere",a:["诚恳"],ex:"诚恳 chéngkěn — 态度很诚恳"},
  {t:"text",q:"běnlǐng — ability / skill",a:["本领"],ex:"本领 běnlǐng — 学本领"},
  {t:"text",q:"yōujiǔ — long-standing (L5 review)",a:["悠久"],ex:"悠久 yōujiǔ — 历史悠久"}]},
 {title:"二、拼音 Pinyin & tones",hint:"tap the correct pinyin",items:[
  {t:"mc",q:"结实 (sturdy / strong)",o:["jiéshí","jiēshi","jiēshí"],a:1,ex:"结实 jiēshi — 1st tone + neutral tone: 身体很结实"},
  {t:"mc",q:"老实 (honest)",o:["lǎoshī","láoshí","lǎoshi"],a:2,ex:"老实 lǎoshi — neutral tone on 实. Careful: lǎoshī = 老师 teacher"},
  {t:"mc",q:"甩 (to swing / throw off)",o:["shuāi","shuǎi","shuài"],a:1,ex:"甩 shuǎi (3rd tone). 摔 shuāi = to fall; 帅 shuài = handsome"},
  {t:"mc",q:"背 in 背米 (carry rice on one's back)",o:["bēi","bèi","běi"],a:0,ex:"背 bēi (1st tone) as a verb 'carry on the back': 背米、背书包"},
  {t:"mc",q:"背 in 后背 (the back of the body)",o:["bēi","běi","bèi"],a:2,ex:"背 bèi (4th tone) as a noun 'the back': 后背 (also 背书 bèi shū = recite)"}]},
 {title:"三、认字 Character recognition",hint:"tap the correct character",items:[
  {t:"mc",q:"fú — support with the hand (扶老人)",o:["抉","扶","挟"],a:1,ex:"扶 — 扌 hand radical + 夫. 抉 jué = choose; 挟 xié = hold under the arm"},
  {t:"mc",q:"zhèn — town (小镇)",o:["填","慎","镇"],a:2,ex:"镇 — 钅 metal radical + 真. 填 tián = fill in (土); 慎 shèn = careful (忄)"},
  {t:"mc",q:"xiào — filial (孝顺)",o:["孝","考","老"],a:0,ex:"孝 — 耂 (old) on top of 子 (child): a child holding up the old. 考 kǎo = exam; 老 lǎo = old"}]},
 {title:"四、完成句子 Sentence building",hint:"1: type the word meaning 'until now'; 2–4: tap the right word",items:[
  {t:"text",q:"子路背米的故事从古代一直流传＿＿＿＿。",a:["至今"],ex:"至今 = until now: 流传至今 (handed down to this day)"},
  {t:"mc",q:"子路做了大官，生活好了，可是他不但不高兴，＿＿＿更难过了。",o:["从而","反而","而且"],a:1,ex:"不但不……，反而…… = not only not…, but instead…: 不但不高兴，反而更难过了。"},
  {t:"mc",q:"下雪以后路很＿＿＿，子路背着米，走得很小心。",o:["扶","滑","甩"],a:1,ex:"滑 huá = slippery: 路很滑。"},
  {t:"mc",q:"孔子称赞子路是一个＿＿＿父母的好孩子。",o:["满足","委屈","孝顺"],a:2,ex:"孝顺父母 = be filial to one's parents."}]},
 {title:"五、阅读 Reading",hint:"read, then tap the answer",passage:"春秋时期，有一个叫子路的年轻人。他家里很穷，常常只能吃野菜。为了让父母吃上米饭，他每次都要走到一百多里外的镇上去买米，再背着米走回家。不管冬天多冷、路多滑，他从来不觉得辛苦。后来，父母去世了，子路到楚国做了官，物质生活非常好，可是他反而常常难过，因为他再也不能为父母背米了。孔子听说以后，称赞他是一个孝顺的人。这个故事从古至今一直流传，孝顺父母也成为中国人的传统美德。",items:[
  {t:"mc",q:"子路为什么要去镇上买米？",o:["为了让父母吃上米饭","因为他想在镇上做官","因为镇上的米很便宜"],a:0,ex:"为了让父母吃上米饭，他每次都要走到一百多里外的镇上去买米。"},
  {t:"mc",q:"子路做官以后为什么常常难过？",o:["因为工作太累了","因为物质生活不好","因为父母已经去世，不能再为他们背米"],a:2,ex:"父母去世了……他再也不能为父母背米了。"},
  {t:"mc",q:"这个故事主要想告诉我们什么？",o:["要努力赚钱","要孝顺父母","做官很辛苦"],a:1,ex:"孝顺父母是中国人的传统美德。"}]}
];
var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId;
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function build(){
 var quiz=document.getElementById("quiz");quiz.innerHTML="";ALL=[];var n=0;
 SECTIONS.forEach(function(s){
  var sec=el("section");var h=el("h2",null,s.title+" ");h.appendChild(el("small",null,"("+s.hint+")"));sec.appendChild(h);
  if(s.passage)sec.appendChild(el("div","passage",s.passage));
  s.items.forEach(function(it,i){
   n++;var box=el("div","item");box.appendChild(el("div","q",(i+1)+". "+it.q));
   var rec={it:it,box:box,sel:null,input:null};
   if(it.t==="mc"){var o=el("div","opts");it.o.forEach(function(txt,j){var b=el("button","opt",L[j]+". "+txt);b.type="button";
     b.onclick=function(){if(done)return;rec.sel=j;[].forEach.call(o.children,function(c){c.classList.remove("sel")});b.classList.add("sel");prog()};o.appendChild(b)});box.appendChild(o)}
   else{var inp=el("input","txt");inp.type="text";inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");inp.setAttribute("spellcheck","false");inp.placeholder="写汉字…";inp.oninput=prog;rec.input=inp;box.appendChild(inp)}
   var fb=el("div","fb");box.appendChild(fb);rec.fb=fb;sec.appendChild(box);ALL.push(rec)});
  quiz.appendChild(sec)});
 prog();
}
function norm(s){return String(s||"").replace(/[\s\u3000]+/g,"")}
function isCorrect(rec){var it=rec.it;if(it.t==="mc")return rec.sel===it.a;var v=norm(rec.input.value);return it.a.some(function(a){return norm(a)===v})}
function answered(rec){return rec.it.t==="mc"?rec.sel!==null:norm(rec.input.value)!==""}
function prog(){var a=ALL.filter(answered).length;document.getElementById("prog").textContent="已答 "+a+" / "+ALL.length}
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function tick(){document.getElementById("clock").textContent=fmt(Date.now()-start)}
function check(){
 if(done)return;done=true;clearInterval(timerId);var score=0;
 ALL.forEach(function(rec){var ok=isCorrect(rec),it=rec.it;rec.box.classList.add(ok?"ok":"bad");
  var ans=it.t==="mc"?L[it.a]+". "+it.o[it.a]:it.a[0];
  rec.fb.textContent=ok?"✔ 对了！":"✘ Correct answer: "+ans+" — "+it.ex;if(ok)score++});
 document.getElementById("quiz").classList.add("locked");
 var t=fmt(Date.now()-start),pct=Math.round(score/ALL.length*100);
 var msg=pct===100?"太棒了！🎉":pct>=80?"很好！👍":pct>=60?"不错，继续加油！💪":"加油！Let's review the red ones. 📚";
 var r=document.getElementById("result");r.style.display="block";r.innerHTML="";
 r.appendChild(el("div",null,"得分 Score: "+score+" / "+ALL.length+" ("+pct+"%)"));
 r.appendChild(el("div",null,"用时 Time: "+t));r.appendChild(el("div",null,msg));
 r.scrollIntoView&&r.scrollIntoView({behavior:"smooth"});
 return {score:score,total:ALL.length,time:t};
}
function reset(){done=false;document.getElementById("quiz").classList.remove("locked");document.getElementById("result").style.display="none";start=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();build();window.scrollTo&&window.scrollTo(0,0)}
document.getElementById("check").onclick=check;
document.getElementById("reset").onclick=reset;
build();timerId=setInterval(tick,1000);tick();
</script>
</body>
</html>
