<script>
var SECTIONS=[{"title":"一、看例句选意思 Meaning in context","hint":"read the sentence, tap the English meaning · 🔊","items":[{"t":"mc","q":"单一","py":"dānyī","say":"单一","o":["single, singular","unit","timid, cowardly","light, weak, bland"],"a":0,"sent":"这种产品的功能太单一，不能满足不同的需要。","sent_en":"This product's functions are too limited to meet different needs.","ex":"单一 dānyī — single, singular · 这种产品的功能太单一，不能满足不同的需要。 / This product's functions are too limited to meet different needs."},{"t":"mc","q":"胆小","py":"dǎnxiǎo","say":"胆小","o":["to block","timid, cowardly","local area","current, present"],"a":1,"sent":"他从小就很胆小，晚上不敢一个人走路。","sent_en":"He has been timid since he was little, and does not dare walk alone at night.","ex":"胆小 dǎnxiǎo — timid, cowardly · 他从小就很胆小，晚上不敢一个人走路。 / He has been timid since he was little, and does not dare walk alone at night."},{"t":"mc","q":"当地","py":"dāngdì","say":"当地","o":["that year, those days","among, in the middle","local area","to treat as"],"a":2,"sent":"我们向当地的人打听去车站的路。","sent_en":"We asked the local people the way to the station.","ex":"当地 dāngdì — local area · 我们向当地的人打听去车站的路。 / We asked the local people the way to the station. (当 is first tone here: dāng)"},{"t":"mc","q":"当前","py":"dāngqián","say":"当前","o":["to face; current, present","that year, those days","to arrive","to expire"],"a":0,"sent":"当前最重要的问题是保护环境。","sent_en":"The most important issue at present is protecting the environment.","ex":"当前 dāngqián — to face; current, present · 当前最重要的问题是保护环境。 / The most important issue at present is protecting the environment."},{"t":"mc","q":"挡","py":"dǎng","say":"挡","o":["to fall, to collapse","to treat as","to pass, to hand over","to block"],"a":3,"sent":"一棵大树挡在路中间，车子过不去。","sent_en":"A big tree was blocking the middle of the road, so the car could not get through.","ex":"挡 dǎng — to block · 一棵大树挡在路中间，车子过不去。 / A big tree was blocking the middle of the road, so the car could not get through. (also in textbook Lesson 5; 3rd tone, not the same as 当 dāng / dàng)"},{"t":"mc","q":"导演","py":"dǎoyǎn","say":"导演","o":["to cause, to lead to","director; to direct","to arrive","reason, principle"],"a":1,"sent":"这部电影的导演很有名，作品受到很多人喜爱。","sent_en":"The director of this film is very famous, and his works are loved by many people.","ex":"导演 dǎoyǎn — director; to direct · 这部电影的导演很有名，作品受到很多人喜爱。 / The director of this film is very famous, and his works are loved by many people."},{"t":"mc","q":"导致","py":"dǎozhì","say":"导致","o":["to arrive","to expire","to cause, to lead to","to register, to record"],"a":2,"sent":"下雨路滑，导致发生了一场车祸。","sent_en":"The rain made the road slippery, which led to a car accident.","ex":"导致 dǎozhì — to cause, to lead to · 下雨路滑，导致发生了一场车祸。 / The rain made the road slippery, which led to a car accident. (不要和「导演」弄混：导致 is a result, 导演 is a film director)"},{"t":"mc","q":"到达","py":"dàodá","say":"到达","o":["to arrive","to cause, to lead to","to wait","to log in"],"a":0,"sent":"火车晚点了，我们晚上八点才到达北京。","sent_en":"The train was late, and we did not arrive in Beijing until eight in the evening.","ex":"到达 dàodá — to arrive · 火车晚点了，我们晚上八点才到达北京。 / The train was late, and we did not arrive in Beijing until eight in the evening."},{"t":"mc","q":"的确","py":"díquè","say":"的确","o":["to lower one's head","to be equal to","enemy","indeed, certainly"],"a":3,"sent":"这道题的确不容易，需要再想一想。","sent_en":"This question is indeed not easy; it needs a bit more thought.","ex":"的确 díquè — indeed, certainly · 这道题的确不容易，需要再想一想。 / This question is indeed not easy; it needs a bit more thought."},{"t":"mc","q":"地区","py":"dìqū","say":"地区","o":["status, position","ground, floor","geography","region, area"],"a":3,"sent":"这个地区的春天来得很早，花开得也特别美。","sent_en":"Spring comes very early in this region, and the flowers are especially beautiful.","ex":"地区 dìqū — region, area · 这个地区的春天来得很早，花开得也特别美。 / Spring comes very early in this region, and the flowers are especially beautiful. (also in textbook Lesson 5; 地区 is a region, 地位 is status, 地理 is geography)"}]},{"title":"二、根据意思选词 Choose the word","hint":"read the English and the sentence, tap the Chinese word · 🔊","items":[{"t":"mc","q":"unit","py":"dānyuán","say":"单元","o":["单一","单元","胆小","淡"],"a":1,"ex":"单元 dānyuán — unit · 这个学期我们要学习五个单元的内容。 / This term we will study the content of five units.","sent":"这个学期我们要学习五个单元的内容。","sent_en":"This term we will study the content of five units."},{"t":"mc","q":"light, weak, bland","py":"dàn","say":"淡","o":["淡","挡","当","倒"],"a":0,"ex":"淡 dàn — light, weak, bland · 这碗汤的味道有点儿淡，可以再放一点盐。 / This bowl of soup tastes a little bland; you can add a bit more salt.","sent":"这碗汤的味道有点儿淡，可以再放一点盐。","sent_en":"This bowl of soup tastes a little bland; you can add a bit more salt."},{"t":"mc","q":"that year, those days","py":"dāngnián","say":"当年","o":["当地","当前","当中","当年"],"a":3,"ex":"当年 dāngnián — that year, those days · 当年他还是个小孩子，现在已经上大学了。 / In those days he was still a little child; now he is already at university. (当 is first tone here: dāng)","sent":"当年他还是个小孩子，现在已经上大学了。","sent_en":"In those days he was still a little child; now he is already at university."},{"t":"mc","q":"among, in the middle","py":"dāngzhōng","say":"当中","o":["当地","当中","当前","当年"],"a":1,"ex":"当中 dāngzhōng — among, in the middle · 这些同学当中，有三个人来自香港。 / Among these classmates, three come from Hong Kong.","sent":"这些同学当中，有三个人来自香港。","sent_en":"Among these classmates, three come from Hong Kong."},{"t":"mc","q":"reason, principle","py":"dàolǐ","say":"道理","o":["到达","到期","道理","导演"],"a":2,"ex":"道理 dàolǐ — reason, principle · 老师把这个道理讲得很清楚，大家都听懂了。 / The teacher explained this principle very clearly, and everyone understood.","sent":"老师把这个道理讲得很清楚，大家都听懂了。","sent_en":"The teacher explained this principle very clearly, and everyone understood."},{"t":"mc","q":"to expire","py":"dàoqī","say":"到期","o":["到达","到期","登记","登录"],"a":1,"ex":"到期 dàoqī — to expire · 我的护照下个月到期，得赶快去办理新的。 / My passport expires next month, so I must hurry to apply for a new one.","sent":"我的护照下个月到期，得赶快去办理新的。","sent_en":"My passport expires next month, so I must hurry to apply for a new one."},{"t":"mc","q":"light, lighting","py":"dēngguāng","say":"灯光","o":["灯光","登记","登录","等待"],"a":0,"ex":"灯光 dēngguāng — light · 舞台上的灯光很亮，演员们都看得清清楚楚。 / The lighting on the stage was very bright, and the actors could all be seen clearly.","sent":"舞台上的灯光很亮，演员们都看得清清楚楚。","sent_en":"The lighting on the stage was very bright, and the actors could all be seen clearly."}]},{"title":"三、填空 Fill the blank","hint":"choose the word that fits the sentence · 🔊","items":[{"t":"mc","q":"大家把他____自己的弟弟，对他特别关心。","o":["当成","挡","倒","登"],"a":0,"say":"当成","sent":"大家把他当成自己的弟弟，对他特别关心。","ex":"当成 dàngchéng — to treat as, to regard as · 大家把他当成自己的弟弟，对他特别关心。 / Everyone regarded him as their own younger brother and cared for him especially.","sent_en":"Everyone regarded him as their own younger brother and cared for him especially."},{"t":"mc","q":"椅子腿断了，他一下子____在地上。","o":["挡","当","倒","登"],"a":2,"say":"倒","sent":"椅子腿断了，他一下子倒在地上。","ex":"倒 dǎo — to fall, to collapse · 椅子腿断了，他一下子倒在地上。 / The chair leg broke, and he suddenly fell to the ground. (here 倒 is 3rd tone dǎo, ‘to fall’; dào is another reading, ‘to pour’ or ‘on the contrary’)","sent_en":"The chair leg broke, and he suddenly fell to the ground."},{"t":"mc","q":"我们一起____上山顶，看到了美丽的日出。","o":["递","登","挡","倒"],"a":1,"say":"登","sent":"我们一起登上山顶，看到了美丽的日出。","ex":"登 dēng — to ascend, to board, to register · 我们一起登上山顶，看到了美丽的日出。 / We climbed to the top of the mountain together and saw a beautiful sunrise.","sent_en":"We climbed to the top of the mountain together and saw a beautiful sunrise."},{"t":"mc","q":"入住酒店时，请先在前台____。","o":["登记","登录","等待","等候"],"a":0,"say":"登记","sent":"入住酒店时，请先在前台登记。","ex":"登记 dēngjì — to register, to record · 入住酒店时，请先在前台登记。 / When checking into the hotel, please register at the front desk first. (登记 is to register in person or on a form; 登录 is to log in to a system)","sent_en":"When checking into the hotel, please register at the front desk first."},{"t":"mc","q":"请输入用户名和密码，然后____邮箱。","o":["登记","登录","到达","到期"],"a":1,"say":"登录","sent":"请输入用户名和密码，然后登录邮箱。","ex":"登录 dēnglù — to log in · 请输入用户名和密码，然后登录邮箱。 / Please enter your user name and password, then log in to the mailbox.","sent_en":"Please enter your user name and password, then log in to the mailbox."},{"t":"mc","q":"请在门口____，老师马上就来。","o":["等于","低头","等待","到达"],"a":2,"say":"等待","sent":"请在门口等待，老师马上就来。","ex":"等待 děngdài — to wait · 请在门口等待，老师马上就来。 / Please wait at the door; the teacher will be here in a moment.","sent_en":"Please wait at the door; the teacher will be here in a moment."}]},{"title":"四、易混词 Look-alikes in sentences","hint":"choose the word that fits · 🔊","items":[{"t":"mc","q":"她把这次失败____一次学习的机会。","o":["挡","倒","当作","登"],"a":2,"say":"当作","sent":"她把这次失败当作一次学习的机会。","ex":"当作 dàngzuò — to treat as, to regard as, to consider as · 她把这次失败当作一次学习的机会。 / She treated this failure as a chance to learn. (当 is 4th tone dàng in 当作 / 当成, ‘to regard as’)","sent_en":"She treated this failure as a chance to learn."},{"t":"mc","q":"乘客们在站台____列车到来。","o":["等候","等于","低头","到达"],"a":0,"say":"等候","sent":"乘客们在站台等候列车到来。","ex":"等候 děnghòu — to wait · 乘客们在站台等候列车到来。 / The passengers waited on the platform for the train to arrive. (等候 and 等待 both mean ‘to wait’; 等候 is a little more formal)","sent_en":"The passengers waited on the platform for the train to arrive."},{"t":"mc","q":"他最喜欢的科目是____，因为可以了解世界各国的山川和城市。","o":["地理","地面","地区","地位"],"a":0,"say":"地理","sent":"他最喜欢的科目是地理，因为可以了解世界各国的山川和城市。","ex":"地理 dìlǐ — geography · 他最喜欢的科目是地理，因为可以了解世界各国的山川和城市。 / His favourite subject is geography, because he can learn about mountains, rivers and cities around the world.","sent_en":"His favourite subject is geography, because he can learn about mountains, rivers and cities around the world."},{"t":"mc","q":"经过多年努力，她在公司里有了很高的____。","o":["地理","地面","地区","地位"],"a":3,"say":"地位","sent":"经过多年努力，她在公司里有了很高的地位。","ex":"地位 dìwèi — status, position · 经过多年努力，她在公司里有了很高的地位。 / After years of hard work, she has a very high position in the company.","sent_en":"After years of hard work, she has a very high position in the company."},{"t":"mc","q":"地铁是在____行驶的，可以避免路上的交通堵塞。","o":["地面","地下","地区","地理"],"a":1,"say":"地下","sent":"地铁是在地下行驶的，可以避免路上的交通堵塞。","ex":"地下 dìxià — underground, basement · 地铁是在地下行驶的，可以避免路上的交通堵塞。 / The metro runs underground, which can help avoid traffic jams on the roads. (地下 is underground; 地面 is the ground or floor)","sent_en":"The metro runs underground, which can help avoid traffic jams on the roads."},{"t":"mc","q":"下午茶时，妈妈准备了几种好吃的____。","o":["点心","点赞","电池","电器"],"a":0,"say":"点心","sent":"下午茶时，妈妈准备了几种好吃的点心。","ex":"点心 diǎnxin — snack, dessert · 下午茶时，妈妈准备了几种好吃的点心。 / At teatime Mum prepared several kinds of tasty snacks. (心 is a neutral tone here: diǎnxin, not diǎnxīn)","sent_en":"At teatime Mum prepared several kinds of tasty snacks."},{"t":"mc","q":"冰箱、洗衣机都是常用的家用____。","o":["电池","电动","电器","点心"],"a":2,"say":"电器","sent":"冰箱、洗衣机都是常用的家用电器。","ex":"电器 diànqì — electrical appliance · 冰箱、洗衣机都是常用的家用电器。 / Fridges and washing machines are both commonly used household electrical appliances. (电器 are appliances; 电池 is a battery; 电动 means electrically powered)","sent_en":"Fridges and washing machines are both commonly used household electrical appliances."}]},{"title":"五、默写 Dictation in context","hint":"🔊 listen, read the sentence, type the characters","items":[{"t":"text","q":"děngyú — to be equal to","say":"等于","sent":"三乘以五____十五。","sent_en":"Three times five equals fifteen.","a":["等于"],"ex":"等于 děngyú — to be equal to · 三乘以五等于十五。 / Three times five equals fifteen."},{"t":"text","q":"dītóu — to lower one's head","say":"低头","sent":"听了批评，他只好____认错。","sent_en":"After hearing the criticism, he could only lower his head and admit his mistake.","a":["低头"],"ex":"低头 dītóu — to lower one's head · 听了批评，他只好低头认错。 / After hearing the criticism, he could only lower his head and admit his mistake."},{"t":"text","q":"dírén — enemy","say":"敌人","sent":"在故事里，英雄终于打败了____。","sent_en":"In the story, the hero finally defeated the enemy.","a":["敌人"] var L="ABCDEFG",ALL=[],start=Date.now(),done=false,timerId,zhVoice=null;
function pickZhVoice(){
  if(!window.speechSynthesis)return null;
  var vs=speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return /^zh(-|_|$)/i.test(v.lang)||/Chinese|中文|普通话|国语/i.test(v.name);});
  var cn=pref.filter(function(v){return /CN|China|普通话|Chinese\s*\(China\)/i.test(v.lang+" "+v.name);});
  return cn[0]||pref[0]||null;
}
function refreshVoice(){zhVoice=pickZhVoice();}
if(window.speechSynthesis){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function hasHan(s){return /[\u4e00-\u9fff]/.test(s||"");}
function speakZh(text,btn){
  if(!text||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang="zh-CN";u.rate=0.9;u.pitch=1;
  if(!zhVoice)refreshVoice();
  if(zhVoice)u.voice=zhVoice;
  if(btn)btn.disabled=true;
  var unlock=function(){if(btn)btn.disabled=false;};
  u.onend=unlock;u.onerror=unlock;
  setTimeout(unlock, Math.max(1800, String(text).length*420));
  speechSynthesis.speak(u);
}
function speakBtn(text, small){
  var b=el("button", small?"say sm":"say");
  b.type="button";b.setAttribute("aria-label","Pronounce");b.textContent="🔊";
  b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();if(ev&&ev.preventDefault)ev.preventDefault();speakZh(text,b);return false;};
  return b;
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function addExample(box, it){
  if(!it.sent && !it.sent_en) return;

    row.appendChild(document.createTextNode("例句："+it.sent+" "));
    if(hasHan(it.sent)) row.appendChild(speakBtn(it.sent.replace(/____/g, it.say||it.q||""), true));

function norm(s){return String(s||"").replace(/[\s\u3000]+/g,"")}

}

document.getElementById("check").onclick=check;

build();timerId=setInterval(tick,1000);tick();
